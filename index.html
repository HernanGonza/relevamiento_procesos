<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relevamiento de Procesos - Ministerio de Ecología</title>

  <!-- React y dependencias -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Tailwind (solo para desarrollo) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Mermaid versión UMD (no modular) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://ketmsuhhyymhprwvoxjx.supabase.co';
    const SUPABASE_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtldG1zdWhoeXltaHByd3ZveGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3ODExODksImV4cCI6MjA3NzM1NzE4OX0.R6sOE9UofsP8NZnhc4uFJF3hTauEjvGJjnoSYtIifbQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Íconos reutilizables
    const Icons = {
      Eye: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 
               0 8.268 2.943 9.542 7-1.274 4.057-5.064 
               7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      ),
    };

    /* ==========================================================
       COMPONENTE: DetalleProceso (corregido para Mermaid)
    ========================================================== */
    function DetalleProceso({ procesoId, onVolver }) {
      const [proceso, setProceso] = useState(null);
      const [entrevista, setEntrevista] = useState(null);
      const [pasos, setPasos] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        async function cargar() {
          try {
            const { data: procData } = await supabase.from('procesos')
              .select('*').eq('id', procesoId).single();
            if (!procData) return setLoading(false);
            setProceso(procData);

            const { data: entData } = await supabase.from('entrevistas')
              .select('*').eq('id', procData.entrevista_id).single();
            setEntrevista(entData);

            const { data: pasosData } = await supabase.from('pasos_proceso')
              .select('*').eq('proceso_id', procesoId)
              .order('orden', { ascending: true });
            setPasos(pasosData || []);
          } catch (err) {
            console.error(err);
          } finally {
            setLoading(false);
          }
        }
        if (procesoId) cargar();
      }, [procesoId]);

      if (loading) return <div className="p-6 text-center">Cargando detalles del proceso...</div>;
      if (!proceso) return <div className="p-6 text-center">Proceso no encontrado</div>;

      // Generar código Mermaid
      let mermaidCode = 'graph TD\n';
      const inicio = 'Inicio((Inicio))';
      const fin = 'Fin((Fin))';
      mermaidCode += `  ${inicio}\n`;

      if (pasos.length > 0) {
        const p1 = `P1`;
        mermaidCode += `  ${p1}["${pasos[0].descripcion.replace(/"/g, '\\"')}"]\n`;
        mermaidCode += `  ${inicio} --> ${p1}\n`;

        pasos.forEach((paso, i) => {
          const actual = `P${i + 1}`;
          const siguiente = i < pasos.length - 1 ? `P${i + 2}` : null;

          if (paso.tiene_decision) {
            const cond = `C${i + 1}`;
            mermaidCode += `  ${cond}{"${paso.condicion_decision.replace(/"/g, '\\"')}"}\n`;
            mermaidCode += `  ${actual} --> ${cond}\n`;

            if (paso.destino_si_cumple) {
              const si = `SI${i + 1}`;
              mermaidCode += `  ${si}["${paso.destino_si_cumple.replace(/"/g, '\\"')}"]\n`;
              mermaidCode += `  ${cond} -->|Sí| ${si}\n  ${si} --> ${fin}\n`;
            }
            if (paso.destino_si_no_cumple) {
              const no = `NO${i + 1}`;
              mermaidCode += `  ${no}["${paso.destino_si_no_cumple.replace(/"/g, '\\"')}"]\n`;
              mermaidCode += `  ${cond} -->|No| ${no}\n  ${no} --> ${fin}\n`;
            }
          } else {
            if (siguiente) {
              mermaidCode += `  ${siguiente}["${pasos[i + 1].descripcion.replace(/"/g, '\\"')}"]\n`;
              mermaidCode += `  ${actual} --> ${siguiente}\n`;
            } else {
              mermaidCode += `  ${actual} --> ${fin}\n`;
            }
          }
        });
      } else {
        mermaidCode += `  ${inicio} --> ${fin}\n`;
      }
      mermaidCode += `  ${fin}\n`;

      // ✅ Renderizar Mermaid correctamente
      useEffect(() => {
        if (window.mermaid && pasos.length > 0) {
          const el = document.getElementById('mermaid-diagram');
          if (el) {
            window.mermaid.render('graphDiv', mermaidCode, (svg) => {
              el.innerHTML = svg;
            });
          }
        }
      }, [pasos]);

      return (
        <div className="bg-white p-6 rounded border max-w-6xl mx-auto">
          <div className="flex justify-between mb-6">
            <div>
              <h2 className="text-2xl font-bold">{proceso.nombre}</h2>
              <p className="text-sm text-gray-600 mt-1">
                {proceso.area_inicio}
                {proceso.areas_intermedias && ` → ${proceso.areas_intermedias}`}
                {proceso.area_cierre && ` → ${proceso.area_cierre}`}
              </p>
            </div>
            <button onClick={onVolver} className="text-blue-600 hover:underline">← Volver</button>
          </div>

          {entrevista && (
            <div className="mb-6 p-4 bg-blue-50 rounded border border-blue-200">
              <h3 className="font-bold text-lg mb-2">Entrevista asociada</h3>
              <div className="grid grid-cols-2 gap-3 text-sm">
                <div><strong>Área:</strong> {entrevista.area}</div>
                <div><strong>Fecha:</strong> {new Date(entrevista.fecha).toLocaleDateString('es-AR')}</div>
              </div>
            </div>
          )}

          {/* ✅ Diagrama Mermaid renderizado correctamente */}
          <div className="mb-6">
            <h3 className="font-bold text-lg mb-2">Diagrama UML (Mermaid)</h3>
            <div id="mermaid-diagram" className="mermaid"></div>
          </div>
        </div>
      );
    }

    // App principal de ejemplo mínima para testear el componente
    function App() {
      return (
        <div className="p-6">
          <DetalleProceso procesoId={1} onVolver={() => alert('Volver')} />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
