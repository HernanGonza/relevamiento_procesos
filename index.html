<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevamiento de Procesos - Ministerio de Ecología</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const SUPABASE_URL = 'https://ketmsuhhyymhprwvoxjx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtldG1zdWhoeXltaHByd3ZveGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3ODExODksImV4cCI6MjA3NzM1NzE4OX0.R6sOE9UofsP8NZnhc4uFJF3hTauEjvGJjnoSYtIifbQ';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const Icons = {
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            ArrowRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Alert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            Eye: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
        };

        function FormularioEntrevista({ entrevistaId, onVolver }) {
            const [loading, setLoading] = useState(false);
            const [entrevista, setEntrevista] = useState(null);
            const [procesos, setProcesos] = useState([{
                nombre: '', frecuencia: 'mensual', prioridad: 'media',
                area_inicio: '', areas_intermedias: '', area_cierre: '',
                pasos: [{
                    descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true,
                    datos_necesarios: '', documentos_generados: '', plazos: '',
                    tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '',
                    pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false
                }]
            }]);

            useEffect(() => {
                if (entrevistaId) {
                    supabase.from('entrevistas').select('*').eq('id', entrevistaId).single().then(({ data }) => {
                        if (data) setEntrevista(data);
                    });
                }
            }, [entrevistaId]);

            const agregarProceso = () => {
                setProcesos([...procesos, {
                    nombre: '', frecuencia: 'mensual', prioridad: 'media',
                    area_inicio: '', areas_intermedias: '', area_cierre: '',
                    pasos: [{ descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true, datos_necesarios: '', documentos_generados: '', plazos: '', tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '', pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false }]
                }]);
            };

            const actualizarProceso = (index, campo, valor) => {
                const nuevos = [...procesos];
                nuevos[index] = { ...nuevos[index], [campo]: valor };
                setProcesos(nuevos);
            };

            const agregarPaso = (procIndex) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos.push({ descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true, datos_necesarios: '', documentos_generados: '', plazos: '', tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '', pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false });
                setProcesos(nuevos);
            };

            const eliminarPaso = (procIndex, pasoIndex) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos = nuevos[procIndex].pasos.filter((_, i) => i !== pasoIndex);
                setProcesos(nuevos);
            };

            const actualizarPaso = (procIndex, pasoIndex, campo, valor) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos[pasoIndex] = { ...nuevos[procIndex].pasos[pasoIndex], [campo]: valor };
                setProcesos(nuevos);
            };

            async function guardarEntrevista() {
                if (!entrevista) return;
                setLoading(true);
                try {
                    await supabase.from('entrevistas').update({ estado: 'realizada' }).eq('id', entrevista.id);

                    for (const proc of procesos) {
                        if (!proc.nombre || !proc.area_inicio) continue;
                        
                        const { data, error } = await supabase.from('procesos').insert([{
                            nombre: proc.nombre,
                            frecuencia: proc.frecuencia,
                            prioridad: proc.prioridad,
                            area_inicio: proc.area_inicio,
                            areas_intermedias: proc.areas_intermedias || null,
                            area_cierre: proc.area_cierre || null,
                            estado_relevamiento: 'en_proceso',
                            entrevista_id: entrevista.id
                        }]).select();
                        
                        if (error) throw error;
                        const procesoId = data[0].id;

                        for (let i = 0; i < proc.pasos.length; i++) {
                            const paso = proc.pasos[i];
                            if (!paso.descripcion) continue;
                            
                            await supabase.from('pasos_proceso').insert({
                                proceso_id: procesoId,
                                orden: i + 1,
                                descripcion: paso.descripcion,
                                responsable_rol: paso.responsable_rol || null,
                                area: paso.area || null,
                                herramienta: paso.herramienta || null,
                                es_manual: paso.es_manual,
                                datos_necesarios: paso.datos_necesarios || null,
                                documentos_generados: paso.documentos_generados || null,
                                plazos: paso.plazos || null,
                                tiene_decision: paso.tiene_decision,
                                condicion_decision: paso.condicion_decision || null,
                                destino_si_cumple: paso.destino_si_cumple || null,
                                destino_si_no_cumple: paso.destino_si_no_cumple || null,
                                pasa_a_otra_area: paso.pasa_a_otra_area,
                                area_destino: paso.area_destino || null,
                                que_envia: paso.que_envia || null,
                                espera_respuesta: paso.espera_respuesta
                            });

                            if (paso.pasa_a_otra_area && paso.area_destino && paso.area) {
                                await supabase.from('handoffs').insert({
                                    proceso: proc.nombre,
                                    area_origen: paso.area,
                                    area_destino: paso.area_destino,
                                    que_se_envia: paso.que_envia || null,
                                    validado_por_origen: false,
                                    validado_por_destino: false,
                                    entrevista_id: entrevista.id
                                });
                            }
                        }
                    }

                    alert('Entrevista guardada');
                    if (onVolver) onVolver();
                } catch (error) {
                    alert('Error: ' + error.message);
                } finally {
                    setLoading(false);
                }
            }

            if (!entrevista) return <div className="p-6">Cargando...</div>;

            return (
                <div className="bg-white p-6 rounded-lg border max-w-6xl mx-auto">
                    <div className="flex justify-between mb-6">
                        <h2 className="text-2xl font-bold">Formulario de Entrevista</h2>
                        <button onClick={onVolver} className="text-blue-600">Volver</button>
                    </div>

                    <div className="mb-6 p-4 border rounded bg-gray-50">
                        <h3 className="font-bold mb-2">Area: {entrevista.area}</h3>
                        <p className="text-sm">Fecha: {new Date(entrevista.fecha).toLocaleDateString('es-AR')}</p>
                    </div>

                    <div className="mb-6">
                        <div className="flex justify-between mb-4">
                            <h3 className="font-bold text-lg">Procesos</h3>
                            <button onClick={agregarProceso} className="bg-blue-600 text-white px-3 py-1 rounded text-sm flex items-center gap-1">
                                <Icons.Plus /> Agregar Proceso
                            </button>
                        </div>

                        {procesos.map((proc, idx) => (
                            <div key={idx} className="mb-6 p-4 border-2 rounded bg-blue-50">
                                <h4 className="font-semibold mb-3">Proceso {idx + 1}</h4>
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <input type="text" placeholder="Nombre del proceso" className="border p-2 rounded" value={proc.nombre} onChange={e => actualizarProceso(idx, 'nombre', e.target.value)} />
                                    <select className="border p-2 rounded" value={proc.frecuencia} onChange={e => actualizarProceso(idx, 'frecuencia', e.target.value)}>
                                        <option value="diaria">Diaria</option>
                                        <option value="semanal">Semanal</option>
                                        <option value="mensual">Mensual</option>
                                        <option value="eventual">Eventual</option>
                                    </select>
                                    <select className="border p-2 rounded" value={proc.prioridad} onChange={e => actualizarProceso(idx, 'prioridad', e.target.value)}>
                                        <option value="baja">Baja</option>
                                        <option value="media">Media</option>
                                        <option value="alta">Alta</option>
                                    </select>
                                    <input type="text" placeholder="Area inicio" className="border p-2 rounded" value={proc.area_inicio} onChange={e => actualizarProceso(idx, 'area_inicio', e.target.value)} />
                                    <input type="text" placeholder="Areas intermedias" className="border p-2 rounded" value={proc.areas_intermedias} onChange={e => actualizarProceso(idx, 'areas_intermedias', e.target.value)} />
                                    <input type="text" placeholder="Area cierre" className="border p-2 rounded" value={proc.area_cierre} onChange={e => actualizarProceso(idx, 'area_cierre', e.target.value)} />
                                </div>

                                <div className="mt-4">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-medium text-sm">Pasos:</span>
                                        <button onClick={() => agregarPaso(idx)} className="bg-green-600 text-white px-2 py-1 rounded text-xs flex items-center gap-1">
                                            <Icons.Plus /> Paso
                                        </button>
                                    </div>
                                    {proc.pasos.map((paso, pidx) => (
                                        <div key={pidx} className="mb-3 p-3 border rounded bg-white">
                                            <div className="flex justify-between mb-2">
                                                <span className="text-sm font-semibold">Paso {pidx + 1}</span>
                                                {proc.pasos.length > 1 && (
                                                    <button onClick={() => eliminarPaso(idx, pidx)} className="text-red-600">
                                                        <Icons.Trash />
                                                    </button>
                                                )}
                                            </div>
                                            <div className="space-y-2">
                                                <input type="text" placeholder="Descripcion" className="border p-2 rounded w-full text-sm" value={paso.descripcion} onChange={e => actualizarPaso(idx, pidx, 'descripcion', e.target.value)} />
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="text" placeholder="Responsable" className="border p-2 rounded text-sm" value={paso.responsable_rol} onChange={e => actualizarPaso(idx, pidx, 'responsable_rol', e.target.value)} />
                                                    <input type="text" placeholder="Area" className="border p-2 rounded text-sm" value={paso.area} onChange={e => actualizarPaso(idx, pidx, 'area', e.target.value)} />
                                                </div>
                                                <input type="text" placeholder="Herramienta" className="border p-2 rounded w-full text-sm" value={paso.herramienta} onChange={e => actualizarPaso(idx, pidx, 'herramienta', e.target.value)} />
                                                
                                                <div className="border-t pt-2">
                                                    <label className="flex items-center gap-2 text-sm">
                                                        <input type="checkbox" checked={paso.pasa_a_otra_area} onChange={e => actualizarPaso(idx, pidx, 'pasa_a_otra_area', e.target.checked)} />
                                                        Pasa a otra area (handoff)
                                                    </label>
                                                    {paso.pasa_a_otra_area && (
                                                        <div className="ml-6 mt-2 space-y-2 bg-orange-50 p-2 rounded">
                                                            <input type="text" placeholder="Area destino" className="border p-2 rounded w-full text-sm" value={paso.area_destino} onChange={e => actualizarPaso(idx, pidx, 'area_destino', e.target.value)} />
                                                            <input type="text" placeholder="Que envia" className="border p-2 rounded w-full text-sm" value={paso.que_envia} onChange={e => actualizarPaso(idx, pidx, 'que_envia', e.target.value)} />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="text-center">
                        <button onClick={guardarEntrevista} disabled={loading} className={'px-6 py-3 rounded font-medium text-white ' + (loading ? 'bg-gray-400' : 'bg-green-600 hover:bg-green-700')}>
                            {loading ? 'Guardando...' : 'Guardar Entrevista'}
                        </button>
                    </div>
                </div>
            );
        }

        function DetalleProceso({ procesoId, onVolver }) {
            const [proceso, setProceso] = useState(null);
            const [pasos, setPasos] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                async function cargar() {
                    const { data: procData } = await supabase.from('procesos').select('*').eq('id', procesoId).single();
                    const { data: pasosData } = await supabase.from('pasos_proceso').select('*').eq('proceso_id', procesoId).order('orden');
                    if (procData) setProceso(procData);
                    if (pasosData) setPasos(pasosData);
                    setLoading(false);
                }
                cargar();
            }, [procesoId]);

            if (loading) return <div className="p-6">Cargando...</div>;
            if (!proceso) return <div className="p-6">No encontrado</div>;

            return (
                <div className="bg-white p-6 rounded border max-w-6xl mx-auto">
                    <div className="flex justify-between mb-6">
                        <h2 className="text-2xl font-bold">{proceso.nombre}</h2>
                        <button onClick={onVolver} className="text-blue-600">Volver</button>
                    </div>

                    <div className="mb-6">
                        <h3 className="font-bold mb-4">Diagrama de Flujo</h3>
                        <div className="space-y-4">
                            {pasos.map((paso, idx) => (
                                <div key={paso.id}>
                                    <div className="flex items-start gap-4">
                                        <div className="w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-sm">
                                            {paso.orden}
                                        </div>
                                        <div className="flex-1 border-2 border-blue-200 rounded p-4 bg-blue-50">
                                            <h4 className="font-semibold mb-2">{paso.descripcion}</h4>
                                            <div className="text-sm text-gray-700">
                                                {paso.responsable_rol && <div>Responsable: {paso.responsable_rol}</div>}
                                                {paso.area && <div>Area: {paso.area}</div>}
                                                {paso.herramienta && <div>Herramienta: {paso.herramienta}</div>}
                                            </div>
                                        </div>
                                    </div>
                                    {paso.pasa_a_otra_area && paso.area_destino && (
                                        <div className="ml-12 mt-2 mb-2">
                                            <div className="border-2 border-orange-400 rounded p-3 bg-orange-50">
                                                <div className="font-semibold text-sm">Pasa a: {paso.area_destino}</div>
                                                {paso.que_envia && <div className="text-sm">Envia: {paso.que_envia}</div>}
                                            </div>
                                        </div>
                                    )}
                                    {idx < pasos.length - 1 && <div className="ml-4 h-6 w-0.5 bg-blue-300"></div>}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function TrackerEntrevistas({ entrevistas, setEntrevistas, onCompletar }) {
            const [form, setForm] = useState({ area: '', fecha: '', responsable: '', entrevistador: '', estado: 'pendiente', notas: '' });

            async function agregar() {
                if (!form.area || !form.fecha) return alert('Completa area y fecha');
                const { data, error } = await supabase.from('entrevistas').insert([form]).select();
                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    setEntrevistas([data[0], ...entrevistas]);
                    setForm({ area: '', fecha: '', responsable: '', entrevistador: '', estado: 'pendiente', notas: '' });
                }
            }

            async function eliminar(id) {
                if (!confirm('Eliminar?')) return;
                const { error } = await supabase.from('entrevistas').delete().eq('id', id);
                if (!error) setEntrevistas(entrevistas.filter(e => e.id !== id));
            }

            const contarPorEstado = (estado) => entrevistas.filter(e => e.estado === estado).length;

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-4 gap-4">
                        <div className="bg-yellow-50 p-4 rounded border">
                            <div className="text-2xl font-bold text-yellow-800">{contarPorEstado('pendiente')}</div>
                            <div className="text-sm">Pendientes</div>
                        </div>
                        <div className="bg-blue-50 p-4 rounded border">
                            <div className="text-2xl font-bold text-blue-800">{contarPorEstado('realizada')}</div>
                            <div className="text-sm">Realizadas</div>
                        </div>
                        <div className="bg-green-50 p-4 rounded border">
                            <div className="text-2xl font-bold text-green-800">{contarPorEstado('validada')}</div>
                            <div className="text-sm">Validadas</div>
                        </div>
                        <div className="bg-orange-50 p-4 rounded border">
                            <div className="text-2xl font-bold text-orange-800">{contarPorEstado('requiere_seguimiento')}</div>
                            <div className="text-sm">Seguimiento</div>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded border">
                        <h3 className="font-semibold mb-3">Nueva Entrevista</h3>
                        <div className="grid grid-cols-2 gap-3">
                            <input type="text" placeholder="Area" className="border p-2 rounded" value={form.area} onChange={e => setForm({ ...form, area: e.target.value })} />
                            <input type="date" className="border p-2 rounded" value={form.fecha} onChange={e => setForm({ ...form, fecha: e.target.value })} />
                            <input type="text" placeholder="Responsable" className="border p-2 rounded" value={form.responsable} onChange={e => setForm({ ...form, responsable: e.target.value })} />
                            <input type="text" placeholder="Entrevistador" className="border p-2 rounded" value={form.entrevistador} onChange={e => setForm({ ...form, entrevistador: e.target.value })} />
                        </div>
                        <button onClick={agregar} className="mt-3 bg-blue-600 text-white px-4 py-2 rounded flex items-center gap-2">
                            <Icons.Plus /> Agregar
                        </button>
                    </div>

                    <div className="space-y-2">
                        {entrevistas.map(e => (
                            <div key={e.id} className="bg-white p-4 rounded border">
                                <div className="flex justify-between">
                                    <div>
                                        <h4 className="font-semibold">{e.area}</h4>
                                        <p className="text-sm text-gray-600">{new Date(e.fecha).toLocaleDateString('es-AR')}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        {e.estado === 'pendiente' && (
                                            <button onClick={() => onCompletar(e.id)} className="bg-green-600 text-white px-3 py-1 rounded text-sm">
                                                Completar
                                            </button>
                                        )}
                                        <button onClick={() => eliminar(e.id)} className="text-red-600 p-2">
                                            <Icons.Trash />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function MatrizProcesos({ procesos, onVerDetalle }) {
            return (
                <div className="bg-white rounded border">
                    <table className="w-full">
                        <thead className="bg-gray-50">
                            <tr>
                                <th className="text-left p-3">Proceso</th>
                                <th className="text-left p-3">Flujo</th>
                                <th className="text-left p-3">Frecuencia</th>
                                <th className="text-left p-3">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {procesos.map(p => (
                                <tr key={p.id} className="border-t">
                                    <td className="p-3 font-medium">{p.nombre}</td>
                                    <td className="p-3 text-sm">{p.area_inicio} → {p.area_cierre || '...'}</td>
                                    <td className="p-3 text-sm">{p.frecuencia}</td>
                                    <td className="p-3">
                                        <button onClick={() => onVerDetalle(p.id)} className="bg-blue-600 text-white px-3 py-1 rounded text-sm flex items-center gap-1">
                                            <Icons.Eye /> Ver
                                        </button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function ValidacionHandoffs({ handoffs, onRecargar }) {
            async function toggleValidacion(id, campo, valorActual) {
                await supabase.from('handoffs').update({ [campo]: !valorActual }).eq('id', id);
                if (onRecargar) onRecargar();
            }

            return (
                <div className="space-y-3">
                    {handoffs.map(h => (
                        <div key={h.id} className="bg-white p-4 rounded border">
                            <h4 className="font-semibold">{h.proceso}</h4>
                            <div className="flex items-center gap-2 text-sm text-gray-600 mt-1">
                                <span className="font-medium">{h.area_origen}</span>
                                <Icons.ArrowRight />
                                <span className="font-medium">{h.area_destino}</span>
                            </div>
                            {h.que_se_envia && <p className="text-sm mt-2">Envia: {h.que_se_envia}</p>}
                            <div className="mt-3 flex gap-4">
                                <label className="flex items-center gap-2 text-sm cursor-pointer">
                                    <input type="checkbox" checked={h.validado_por_origen} onChange={() => toggleValidacion(h.id, 'validado_por_origen', h.validado_por_origen)} />
                                    Validado por {h.area_origen}
                                </label>
                                <label className="flex items-center gap-2 text-sm cursor-pointer">
                                    <input type="checkbox" checked={h.validado_por_destino} onChange={() => toggleValidacion(h.id, 'validado_por_destino', h.validado_por_destino)} />
                                    Validado por {h.area_destino}
                                </label>
                            </div>
                            {h.validado_por_origen && h.validado_por_destino && (
                                <div className="mt-2 bg-green-50 text-green-700 px-3 py-1 rounded text-sm flex items-center gap-2">
                                    <Icons.Check /> Validado por ambas areas
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('tracker');
            const [entrevistas, setEntrevistas] = useState([]);
            const [procesos, setProcesos] = useState([]);
            const [handoffs, setHandoffs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [entrevistaEnProgreso, setEntrevistaEnProgreso] = useState(null);
            const [procesoSeleccionado, setProcesoSeleccionado] = useState(null);

            useEffect(() => {
                loadData();
            }, []);

            async function loadData() {
                try {
                    const [e, p, h] = await Promise.all([
                        supabase.from('entrevistas').select('*').order('fecha', { ascending: false }),
                        supabase.from('procesos').select('*').order('created_at', { ascending: false }),
                        supabase.from('handoffs').select('*').order('created_at', { ascending: false })
                    ]);
                    if (e.data) setEntrevistas(e.data);
                    if (p.data) setProcesos(p.data);
                    if (h.data) setHandoffs(h.data);
                } catch (error) {
                    console.error('Error:', error);
                } finally {
                    setLoading(false);
                }
            }

            function iniciarCompletar(id) {
                setEntrevistaEnProgreso(id);
                setActiveTab('completar');
            }

            function volverAlTracker() {
                setEntrevistaEnProgreso(null);
                setActiveTab('tracker');
                loadData();
            }

            function verDetalleProceso(id) {
                setProcesoSeleccionado(id);
                setActiveTab('detalle-proceso');
            }

            function volverAProcesos() {
                setProcesoSeleccionado(null);
                setActiveTab('procesos');
            }

            if (loading) return <div className="p-6 text-center">Cargando...</div>;

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-6">
                            <h1 className="text-3xl font-bold">Sistema de Relevamiento de Procesos</h1>
                            <p className="text-gray-600 mt-1">Ministerio de Ecología - Provincia de Misiones</p>
                        </div>
                        
                        {activeTab !== 'completar' && activeTab !== 'detalle-proceso' && (
                            <div className="flex gap-2 mb-6 border-b">
                                <button 
                                    onClick={() => setActiveTab('tracker')} 
                                    className={'px-4 py-2 font-medium ' + (activeTab === 'tracker' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600')}
                                >
                                    Tracker de Entrevistas
                                </button>
                                <button 
                                    onClick={() => setActiveTab('procesos')} 
                                    className={'px-4 py-2 font-medium ' + (activeTab === 'procesos' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600')}
                                >
                                    Matriz de Procesos ({procesos.length})
                                </button>
                                <button 
                                    onClick={() => setActiveTab('handoffs')} 
                                    className={'px-4 py-2 font-medium ' + (activeTab === 'handoffs' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600')}
                                >
                                    Handoffs ({handoffs.length})
                                </button>
                            </div>
                        )}

                        <div>
                            {activeTab === 'tracker' && (
                                <TrackerEntrevistas 
                                    entrevistas={entrevistas} 
                                    setEntrevistas={setEntrevistas} 
                                    onCompletar={iniciarCompletar} 
                                />
                            )}
                            {activeTab === 'completar' && (
                                <FormularioEntrevista 
                                    entrevistaId={entrevistaEnProgreso} 
                                    onVolver={volverAlTracker} 
                                />
                            )}
                            {activeTab === 'procesos' && (
                                <MatrizProcesos 
                                    procesos={procesos} 
                                    onVerDetalle={verDetalleProceso} 
                                />
                            )}
                            {activeTab === 'detalle-proceso' && (
                                <DetalleProceso 
                                    procesoId={procesoSeleccionado} 
                                    onVolver={volverAProcesos} 
                                />
                            )}
                            {activeTab === 'handoffs' && (
                                <ValidacionHandoffs 
                                    handoffs={handoffs} 
                                    onRecargar={loadData} 
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
