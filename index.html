<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevamiento de Procesos - Ministerio de Ecología</title>

    <!-- React (producción) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel (para JSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind (desarrollo) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mermaid v10 (versión estable con render seguro) -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            flowchart: { useMaxWidth: true }
        });
    </script>
</head>
<body class="bg-gray-50">
    <div id="root">Cargando aplicación...</div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://ketmsuhhyymhprwvoxjx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtldG1zdWhoeXltaHByd3ZveGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3ODExODksImV4cCI6MjA3NzM1NzE4OX0.R6sOE9UofsP8NZnhc4uFJF3hTauEjvGJjnoSYtIifbQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const Icons = {
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            ArrowRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            Eye: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
        };

        // ====== COMPONENTES ======

        function DetalleProceso({ procesoId, onVolver }) {
            const [proceso, setProceso] = useState(null);
            const [entrevista, setEntrevista] = useState(null);
            const [pasos, setPasos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [mermaidSvg, setMermaidSvg] = useState('');
            const diagramRef = useRef(null);

            useEffect(() => {
                let cancelado = false;
                async function cargar() {
                    try {
                        const { data: procData } = await supabase.from('procesos').select('*').eq('id', procesoId).single();
                        if (!procData || cancelado) return;
                        setProceso(procData);

                        const { data: entData } = await supabase.from('entrevistas').select('*').eq('id', procData.entrevista_id).single();
                        if (!cancelado) setEntrevista(entData || null);

                        const { data: pasosData } = await supabase.from('pasos_proceso').select('*').eq('proceso_id', procesoId).order('orden', { ascending: true });
                        if (!cancelado) setPasos(pasosData || []);
                    } catch (err) {
                        console.error(err);
                    } finally {
                        if (!cancelado) setLoading(false);
                    }
                }
                if (procesoId) cargar();
                return () => { cancelado = true; };
            }, [procesoId]);

            // MERMAID: Render seguro cuando el DOM esté listo
            useEffect(() => {
                if (!pasos.length || !window.mermaid || !diagramRef.current) return;

                const escape = (str) => (str || '').replace(/"/g, '\\"').replace(/\n/g, ' ');

                let code = `graph TD\n`;
                code += `  Inicio((Inicio)):::inicio\n`;
                code += `  Fin((Fin)):::fin\n`;

                let lastNode = 'Inicio';
                pasos.forEach((paso, i) => {
                    const pasoId = `P${i + 1}`;
                    const label = escape(paso.descripcion);
                    code += `  ${pasoId}["${label}"]:::paso\n`;
                    code += `  ${lastNode} --> ${pasoId}\n`;

                    if (paso.tiene_decision) {
                        const condId = `C${i + 1}`;
                        code += `  ${condId}{${escape(paso.condicion_decision)}}:::decision\n`;
                        code += `  ${pasoId} --> ${condId}\n`;
                        if (paso.destino_si_cumple) {
                            const siId = `SI${i + 1}`;
                            code += `  ${siId}["${escape(paso.destino_si_cumple)}"]:::destino\n`;
                            code += `  ${condId} -->|Sí| ${siId}\n`;
                        }
                        if (paso.destino_si_no_cumple) {
                            const noId = `NO${i + 1}`;
                            code += `  ${noId}["${escape(paso.destino_si_no_cumple)}"]:::destino\n`;
                            code += `  ${condId} -->|No| ${noId}\n`;
                        }
                    } else if (paso.pasa_a_otra_area && paso.area_destino) {
                        const handoffId = `H${i + 1}`;
                        code += `  ${handoffId}["→ ${escape(paso.area_destino)}"]:::handoff\n`;
                        code += `  ${pasoId} --> ${handoffId}\n`;
                    } else if (i === pasos.length - 1) {
                        code += `  ${pasoId} --> Fin\n`;
                    }
                    lastNode = pasoId;
                });

                code += `\n  classDef inicio fill:#1e40af,stroke:#1e40af,color:white\n`;
                code += `  classDef fin fill:#16a34a,stroke:#16a34a,color:white\n`;
                code += `  classDef paso fill:#dbeafe,stroke:#3b82f6\n`;
                code += `  classDef decision fill:#fef3c7,stroke:#f59e0b,stroke-dasharray: 5 5\n`;
                code += `  classDef destino fill:#fecaca,stroke:#ef4444\n`;
                code += `  classDef handoff fill:#fff7ed,stroke:#ea580c\n`;

                // Render seguro
                const renderDiagram = async () => {
                    try {
                        const { svg } = await window.mermaid.render(`mermaid-${procesoId}`, code);
                        setMermaidSvg(svg);
                    } catch (err) {
                        setMermaidSvg(`<div class="text-red-600 p-4">Error: ${err.message}</div>`);
                    }
                };

                // Aseguramos que el DOM esté listo
                if (document.readyState === 'complete') {
                    renderDiagram();
                } else {
                    window.addEventListener('load', renderDiagram);
                    return () => window.removeEventListener('load', renderDiagram);
                }
            }, [pasos, procesoId]);

            if (loading) return <div className="p-6 text-center">Cargando detalles...</div>;
            if (!proceso) return <div className="p-6 text-center text-red-600">Proceso no encontrado</div>;

            return (
                <div className="bg-white p-6 rounded border max-w-6xl mx-auto">
                    <div className="flex justify-between mb-6">
                        <div>
                            <h2 className="text-2xl font-bold">{proceso.nombre}</h2>
                            <p className="text-sm text-gray-600">{proceso.area_inicio} → {proceso.area_cierre || '...'}</p>
                        </div>
                        <button onClick={onVolver} className="text-blue-600 hover:underline">Volver</button>
                    </div>

                    {entrevista && (
                        <div className="mb-6 p-4 bg-blue-50 rounded">
                            <h3 className="font-bold mb-2">Entrevista</h3>
                            <div className="grid grid-cols-2 gap-2 text-sm">
                                <div><strong>Área:</strong> {entrevista.area}</div>
                                <div><strong>Fecha:</strong> {new Date(entrevista.fecha).toLocaleDateString('es-AR')}</div>
                                <div><strong>Entrevistador:</strong> {entrevista.entrevistador}</div>
                                <div><strong>Estado:</strong> {entrevista.estado}</div>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-4 mb-6 p-4 bg-gray-50 rounded text-sm">
                        <div><strong>Frecuencia:</strong> {proceso.frecuencia}</div>
                        <div><strong>Prioridad:</strong> {proceso.prioridad}</div>
                        <div><strong>Estado:</strong> {proceso.estado_relevamiento}</div>
                    </div>

                    <div className="mb-6">
                        <h3 className="font-bold text-lg mb-4">Pasos</h3>
                        {pasos.map((paso, i) => (
                            <div key={paso.id} className="mb-4 p-4 bg-blue-50 rounded border">
                                <div className="font-semibold">Paso {paso.orden}: {paso.descripcion}</div>
                                <div className="grid grid-cols-2 gap-2 text-sm mt-2">
                                    {paso.responsable_rol && <div><strong>Responsable:</strong> {paso.responsable_rol}</div>}
                                    {paso.area && <div><strong>Área:</strong> {paso.area}</div>}
                                    {paso.herramienta && <div><strong>Herramienta:</strong> {paso.herramienta}</div>}
                                    {paso.plazos && <div><strong>Plazo:</strong> {paso.plazos}</div>}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div ref={diagramRef} className="mb-6 p-4 bg-gray-50 rounded border">
                        <h3 className="font-bold text-lg mb-2">Diagrama Mermaid</h3>
                        {mermaidSvg ? (
                            <div dangerouslySetInnerHTML={{ __html: mermaidSvg }} />
                        ) : (
                            <div className="text-gray-500">Generando diagrama...</div>
                        )}
                    </div>
                </div>
            );
        }

        // ====== APP PRINCIPAL ======

        function App() {
            const [activeTab, setActiveTab] = useState('tracker');
            const [entrevistas, setEntrevistas] = useState([]);
            const [procesos, setProcesos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [procesoSeleccionado, setProcesoSeleccionado] = useState(null);

            useEffect(() => {
                async function cargar() {
                    const [e, p] = await Promise.all([
                        supabase.from('entrevistas').select('*').order('fecha', { ascending: false }),
                        supabase.from('procesos').select('*')
                    ]);
                    setEntrevistas(e.data || []);
                    setProcesos(p.data || []);
                    setLoading(false);
                }
                cargar();
            }, []);

            const verProceso = (id) => {
                setProcesoSeleccionado(id);
                setActiveTab('detalle');
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-xl">Cargando aplicación...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-7xl mx-auto">
                        <h1 className="text-3xl font-bold mb-2">Sistema de Relevamiento de Procesos</h1>
                        <p className="text-gray-600 mb-6">Ministerio de Ecología - Misiones</p>

                        {activeTab !== 'detalle' && (
                            <div className="flex gap-4 mb-6 border-b">
                                <button onClick={() => setActiveTab('tracker')} className={`pb-2 ${activeTab === 'tracker' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}>
                                    Tracker
                                </button>
                                <button onClick={() => setActiveTab('procesos')} className={`pb-2 ${activeTab === 'procesos' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'}`}>
                                    Procesos ({procesos.length})
                                </button>
                            </div>
                        )}

                        {activeTab === 'detalle' && procesoSeleccionado && (
                            <DetalleProceso procesoId={procesoSeleccionado} onVolver={() => setActiveTab('procesos')} />
                        )}

                        {activeTab === 'procesos' && (
                            <div className="bg-white rounded border overflow-hidden">
                                <table className="w-full">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="text-left p-3">Proceso</th>
                                            <th className="text-left p-3">Flujo</th>
                                            <th className="text-left p-3">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {procesos.map(p => (
                                            <tr key={p.id} className="border-t">
                                                <td className="p-3 font-medium">{p.nombre}</td>
                                                <td className="p-3 text-sm">{p.area_inicio} → {p.area_cierre || '...'}</td>
                                                <td className="p-3">
                                                    <button onClick={() => verProceso(p.id)} className="bg-blue-600 text-white px-3 py-1 rounded text-sm flex items-center gap-1">
                                                        <Icons.Eye /> Ver
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'tracker' && (
                            <div className="bg-white p-6 rounded border">
                                <h2 className="text-xl font-bold mb-4">Tracker de Entrevistas</h2>
                                <p className="text-gray-600">Aquí iría el formulario de agendamiento (puedes agregarlo después).</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Renderizar solo cuando todo esté listo
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
