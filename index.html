   <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    window.mermaid = mermaid;
    mermaid.initialize({ 
        startOnLoad: false, 
        theme: 'base',
        themeVariables: {
            primaryColor: '#3b82f6',
            primaryTextColor: '#1f2937',
            primaryBorderColor: '#2563eb',
            lineColor: '#6b7280',

    });
</script>
    <style>

            --color-text: #0f172a;

        body {
            background-color: var(--color-bg);

            transition: background-color 0.3s, color 0.3s;
        }
        
        .bg-surface {
            background-color: var(--color-surface);

            color: var(--color-text);
        }
        
        .text-text-secondary {
            color: var(--color-text-secondary);
        }
        
        .border-border {
            border-color: var(--color-border);
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 1rem;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #475569;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }
        
        .toggle-icons {
            position: absolute;
            display: flex;
            justify-content: space-between;
            width: 100%;
            top: 5px;
            pointer-events: none;
            font-size: 16px;
        }
        
        .toggle-icons .sun {
            left: 7px;

            color: #f59e0b;
        }
        
        .toggle-icons .moon {
            right: 7px;
            position: absolute;
            color: #64748b;
        }
        
        input:checked + .toggle-slider .sun {
            color: #64748b;
        }
        
        input:checked + .toggle-slider .moon {
            color: #60a5fa;

        select, input[type="text"], input[type="date"], input[type="time"], textarea {
            background-color: var(--color-surface);

        select option {

        table {

        }
        
        th, td {
            border-color: var(--color-border);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        input[type="checkbox"] {
            accent-color: var(--color-primary);
        }
        
        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
        }
        
        .btn-success {
            background-color: var(--color-success);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            background-color: var(--color-success-hover);
        }
        
        .btn-danger {
            color: var(--color-danger);
        }
        
        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }
        
        .card-info {
            background-color: var(--color-primary-light);
            border-color: var(--color-primary);
        }
        
        .card-success {
            background-color: var(--color-success-light);
            border-color: var(--color-success);
        }
        
        .card-warning {
            background-color: var(--color-warning-light);
            border-color: var(--color-warning);
        }
        
        .badge-primary {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
        }
        .dark .badge-primary {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
        }
/* Estilos para diagramas Mermaid */
        .mermaid-diagram svg {
            max-width: 100%;
            height: auto;
        }
        
        .dark .mermaid-diagram svg text {
            fill: #f1f5f9 !important;
            font-weight: 500;
        }
        
        .dark .mermaid-diagram svg .node rect,
        .dark .mermaid-diagram svg .node circle,
        .dark .mermaid-diagram svg .node polygon {
            stroke: #60a5fa !important;
            stroke-width: 2px;
        }
        
        .dark .mermaid-diagram svg .edgePath .path {
            stroke: #94a3b8 !important;
            stroke-width: 2px;
        }
        
        .dark .mermaid-diagram svg .edgeLabel {
            background-color: #1e293b !important;
        }
        
        .dark .mermaid-diagram svg .edgeLabel rect {
            fill: #1e293b !important;
        }
        
        .dark .mermaid-diagram svg .cluster rect {
            fill: #0f172a !important;
            stroke: #475569 !important;
        }
    </style>
</head>
<body class="dark">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://ketmsuhhyymhprwvoxjx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtldG1zdWhoeXltaHByd3ZveGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3ODExODksImV4cCI6MjA3NzM1NzE4OX0.R6sOE9UofsP8NZnhc4uFJF3hTauEjvGJjnoSYtIifbQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const Icons = {
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            ArrowRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Alert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            Eye: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
        };

        function DarkModeToggle({ darkMode, setDarkMode }) {
            return (
                <label className="toggle-switch">
                    <input type="checkbox" checked={darkMode} onChange={() => setDarkMode(!darkMode)} />
                    <span className="toggle-slider">
                        <span className="toggle-icons">
                            <span className="sun">☀</span>
                            <span className="moon">🌙</span>
                        </span>
                    </span>
                </label>
            );
        }

        function FormularioEntrevista({ entrevistaId, onVolver }) {
            const [loading, setLoading] = useState(false);
            const [entrevista, setEntrevista] = useState(null);
            const [procesos, setProcesos] = useState([{
                nombre: '', frecuencia: 'mensual', prioridad: 'media',
                area_inicio: '', areas_intermedias: '', area_cierre: '',
                pasos: [{
                    descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true,
                    datos_necesarios: '', documentos_generados: '', plazos: '',
                    tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '',
                    pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false
                }]
            }]);
            const [complemento, setComplemento] = useState({
                publico_usuarios: [],
                interacciones_externas: '',
                sistemas_usados: '',
                tiene_manuales: false,
                resolucion_formularios: '',
                entrevistados: '',
                acuerdos: '',
                observaciones_generales: ''
            });
            
            useEffect(() => {
                if (entrevistaId) {
                    supabase.from('entrevistas').select('*').eq('id', entrevistaId).single().then(({ data }) => {
                        if (data) {
                            setEntrevista(data);
                            if (data.publico_usuarios) {
                                setComplemento(prev => ({ ...prev, publico_usuarios: data.publico_usuarios }));
                            }
                        }
                    });
                }
            }, [entrevistaId]);
            
            const publicoOpciones = ['Ciudadanos', 'Empresas privadas', 'Municipios', 'ONGs', 'Otras áreas del Ministerio', 'Otros organismos provinciales', 'Organismos nacionales', 'Otros'];
            
            const togglePublico = (valor) => {
                setComplemento(prev => {
                    const lista = [...prev.publico_usuarios];
                    if (lista.includes(valor)) {
                        return { ...prev, publico_usuarios: lista.filter(x => x !== valor) };
                    } else {
                        return { ...prev, publico_usuarios: [...lista, valor] };
                    }
                });
            };
            
            const agregarProceso = () => {
                setProcesos([...procesos, {
                    nombre: '', frecuencia: 'mensual', prioridad: 'media',
                    area_inicio: '', areas_intermedias: '', area_cierre: '',
                    pasos: [{ descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true, datos_necesarios: '', documentos_generados: '', plazos: '', tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '', pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false }]
                }]);
            };
            
            const eliminarProceso = (index) => {
                setProcesos(procesos.filter((_, i) => i !== index));
            };
            
            const actualizarProceso = (index, campo, valor) => {
                const nuevos = [...procesos];
                nuevos[index] = { ...nuevos[index], [campo]: valor };
                setProcesos(nuevos);
            };
            
            const agregarPaso = (procIndex) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos.push({ descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true, datos_necesarios: '', documentos_generados: '', plazos: '', tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '', pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false });
                setProcesos(nuevos);
            };
            
            const eliminarPaso = (procIndex, pasoIndex) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos = nuevos[procIndex].pasos.filter((_, i) => i !== pasoIndex);
                setProcesos(nuevos);
            };
            
            const actualizarPaso = (procIndex, pasoIndex, campo, valor) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos[pasoIndex] = { ...nuevos[procIndex].pasos[pasoIndex], [campo]: valor };
                setProcesos(nuevos);
            };
            
            async function guardarEntrevista() {
                if (!entrevista) return;
                setLoading(true);
                try {
                    await supabase.from('entrevistas').update({
                        estado: 'realizada',
                        publico_usuarios: complemento.publico_usuarios.length ? complemento.publico_usuarios : null,
                        interacciones_externas: complemento.interacciones_externas || null,
                        sistemas_usados: complemento.sistemas_usados || null,
                        tiene_manuales: complemento.tiene_manuales,
                        resolucion_formularios: complemento.resolucion_formularios || null,
                        entrevistados: complemento.entrevistados || null,
                        acuerdos: complemento.acuerdos || null,
                        observaciones_generales: complemento.observaciones_generales || null
                    }).eq('id', entrevista.id);
                    
                    for (const proc of procesos) {
                        if (!proc.nombre || !proc.area_inicio) continue;
                        const { data, error } = await supabase.from('procesos').insert([{
                            nombre: proc.nombre,
                            frecuencia: proc.frecuencia,
                            prioridad: proc.prioridad,
                            area_inicio: proc.area_inicio,
                            areas_intermedias: proc.areas_intermedias || null,
                            area_cierre: proc.area_cierre || null,
                            estado_relevamiento: 'en_proceso',
                            entrevista_id: entrevista.id
                        }]).select();
                        
                        if (error) throw error;
                        const procesoId = data[0].id;
                        
                        for (let i = 0; i < proc.pasos.length; i++) {
                            const paso = proc.pasos[i];
                            if (!paso.descripcion) continue;
                            await supabase.from('pasos_proceso').insert({
                                proceso_id: procesoId,
                                orden: i + 1,
                                descripcion: paso.descripcion,
                                responsable_rol: paso.responsable_rol || null,
                                area: paso.area || null,
                                herramienta: paso.herramienta || null,
                                es_manual: paso.es_manual,
                                datos_necesarios: paso.datos_necesarios || null,
                                documentos_generados: paso.documentos_generados || null,
                                plazos: paso.plazos || null,
                                tiene_decision: paso.tiene_decision,
                                condicion_decision: paso.condicion_decision || null,
                                destino_si_cumple: paso.destino_si_cumple || null,
                                destino_si_no_cumple: paso.destino_si_no_cumple || null,
                                pasa_a_otra_area: paso.pasa_a_otra_area,
                                area_destino: paso.area_destino || null,
                                que_envia: paso.que_envia || null,
                                espera_respuesta: paso.espera_respuesta
                            });
                            
                            if (paso.pasa_a_otra_area && paso.area_destino && paso.area) {
                                await supabase.from('handoffs').insert({
                                    proceso: proc.nombre,
                                    area_origen: paso.area,
                                    area_destino: paso.area_destino,
                                    que_se_envia: paso.que_envia || null,
                                    validado_por_origen: false,
                                    validado_por_destino: false,
                                    entrevista_id: entrevista.id
                                });
                            }
                        }
                    }
                    alert('Entrevista guardada exitosamente');
                    if (onVolver) onVolver();
                } catch (error) {
                    alert('Error: ' + error.message);
                } finally {
                    setLoading(false);
                }
            }
            
            if (!entrevista) return <div className="p-6 text-text">Cargando...</div>;
            
            return (
                <div className="bg-surface p-6 rounded-lg border border-border max-w-6xl mx-auto">
                    <div className="flex justify-between mb-6">
                        <h2 className="text-2xl font-bold text-text">Formulario Completo de Entrevista</h2>
                        <button onClick={onVolver} className="text-primary hover:underline">Volver</button>
                    </div>
                    
                    <div className="mb-8 p-4 border border-border rounded bg-surface">
                        <h3 className="font-bold text-lg mb-3 text-primary">Parte 1: Identificación del Área</h3>
                        <div className="grid grid-cols-2 gap-4 mb-4 text-text">
                            <div><strong>Área:</strong> {entrevista.area}</div>
                            <div><strong>Fecha:</strong> {new Date(entrevista.fecha).toLocaleDateString('es-AR')}</div>
                            <div><strong>Hora:</strong> {entrevista.hora ? entrevista.hora.slice(0, 5) : '—'}</div>
                            <div><strong>Responsable:</strong> {entrevista.responsable || '—'}</div>
                            <div><strong>Entrevistador:</strong> {entrevista.entrevistador || '—'}</div>
                        </div>
                        <div className="mt-4">
                            <p className="font-medium mb-2 text-text">Público/Usuarios:</p>
                            <div className="flex flex-wrap gap-2">
                                {publicoOpciones.map(opt => (
                                    <label key={opt} className="flex items-center gap-1 text-sm text-text">
                                        <input type="checkbox" checked={complemento.publico_usuarios.includes(opt)} onChange={() => togglePublico(opt)} className="rounded" />
                                        {opt}
                                    </label>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    <div className="mb-8">
                        <div className="flex justify-between mb-4">
                            <h3 className="font-bold text-lg text-primary">Parte 2 y 3: Procesos y Pasos Detallados</h3>
                            <button onClick={agregarProceso} className="btn-primary px-3 py-1 rounded text-sm flex items-center gap-1">
                                <Icons.Plus /> Agregar Proceso
                            </button>
                        </div>
                        {procesos.map((proc, idx) => (
                            <div key={idx} className="mb-6 p-4 border-2 rounded-lg bg-surface border-border">
                                <div className="flex justify-between mb-3">
                                    <h4 className="font-semibold text-lg text-text">Proceso #{idx + 1}</h4>
                                    {procesos.length > 1 && (
                                        <button onClick={() => eliminarProceso(idx)} className="btn-danger p-1 rounded">
                                            <Icons.Trash />
                                        </button>
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <input type="text" placeholder="Nombre del proceso *" className="border border-border p-2 rounded" value={proc.nombre} onChange={e => actualizarProceso(idx, 'nombre', e.target.value)} />
                                    <select className="border border-border p-2 rounded" value={proc.frecuencia} onChange={e => actualizarProceso(idx, 'frecuencia', e.target.value)}>
                                        <option value="diaria">Diaria</option>
                                        <option value="semanal">Semanal</option>
                                        <option value="mensual">Mensual</option>
                                        <option value="eventual">Eventual</option>
                                    </select>
                                    <select className="border border-border p-2 rounded" value={proc.prioridad} onChange={e => actualizarProceso(idx, 'prioridad', e.target.value)}>
                                        <option value="baja">Prioridad Baja</option>
                                        <option value="media">Prioridad Media</option>
                                        <option value="alta">Prioridad Alta</option>
                                    </select>
                                    <input type="text" placeholder="Área que inicia *" className="border border-border p-2 rounded" value={proc.area_inicio} onChange={e => actualizarProceso(idx, 'area_inicio', e.target.value)} />
                                    <input type="text" placeholder="Áreas intermedias (separadas por coma)" className="border border-border p-2 rounded" value={proc.areas_intermedias} onChange={e => actualizarProceso(idx, 'areas_intermedias', e.target.value)} />
                                    <input type="text" placeholder="Área que cierra" className="border border-border p-2 rounded" value={proc.area_cierre} onChange={e => actualizarProceso(idx, 'area_cierre', e.target.value)} />
                                </div>
                                <div className="mt-4">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-medium text-sm text-text">Pasos del proceso:</span>
                                        <button onClick={() => agregarPaso(idx)} className="btn-success px-2 py-1 rounded text-xs flex items-center gap-1">
                                            <Icons.Plus /> Agregar Paso
                                        </button>
                                    </div>
                                    {proc.pasos.map((paso, pidx) => (
                                        <div key={pidx} className="mb-3 p-3 border border-border rounded bg-surface shadow-sm">
                                            <div className="flex justify-between mb-2">
                                                <span className="text-sm font-semibold badge-primary px-2 py-1 rounded">Paso {pidx + 1}</span>
                                                {proc.pasos.length > 1 && (
                                                    <button onClick={() => eliminarPaso(idx, pidx)} className="btn-danger p-1 rounded">
                                                        <Icons.Trash />
                                                    </button>
                                                )}
                                            </div>
                                            <div className="space-y-2">
                                                <input type="text" placeholder="¿Qué se hace?" className="border border-border p-2 rounded w-full text-sm" value={paso.descripcion} onChange={e => actualizarPaso(idx, pidx, 'descripcion', e.target.value)} />
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="text" placeholder="¿Quién lo hace? (rol)" className="border border-border p-2 rounded text-sm" value={paso.responsable_rol} onChange={e => actualizarPaso(idx, pidx, 'responsable_rol', e.target.value)} />
                                                    <input type="text" placeholder="Área donde se realiza" className="border border-border p-2 rounded text-sm" value={paso.area} onChange={e => actualizarPaso(idx, pidx, 'area', e.target.value)} />
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="text" placeholder="Herramienta/sistema" className="border border-border p-2 rounded text-sm" value={paso.herramienta} onChange={e => actualizarPaso(idx, pidx, 'herramienta', e.target.value)} />
                                                    <label className="flex items-center gap-2 text-sm border border-border p-2 rounded bg-surface text-text">
                                                        <input type="checkbox" checked={paso.es_manual} onChange={e => actualizarPaso(idx, pidx, 'es_manual', e.target.checked)} className="rounded" />
                                                        Es manual
                                                    </label>
                                                </div>
                                                <input type="text" placeholder="Datos necesarios" className="border border-border p-2 rounded w-full text-sm" value={paso.datos_necesarios} onChange={e => actualizarPaso(idx, pidx, 'datos_necesarios', e.target.value)} />
                                                <input type="text" placeholder="Documentos generados" className="border border-border p-2 rounded w-full text-sm" value={paso.documentos_generados} onChange={e => actualizarPaso(idx, pidx, 'documentos_generados', e.target.value)} />
                                                <input type="text" placeholder="Plazos" className="border border-border p-2 rounded w-full text-sm" value={paso.plazos} onChange={e => actualizarPaso(idx, pidx, 'plazos', e.target.value)} />
                                                <div className="border-t border-border pt-2">
                                                    <label className="flex items-center gap-2 text-sm font-medium text-text">
                                                        <input type="checkbox" checked={paso.tiene_decision} onChange={e => actualizarPaso(idx, pidx, 'tiene_decision', e.target.checked)} className="rounded" />
                                                        Tiene punto de decisión
                                                    </label>
                                                    {paso.tiene_decision && (
                                                        <div className="ml-6 mt-2 space-y-2 card-warning p-2 rounded border">
                                                            <input type="text" placeholder="Condición a evaluar" className="border border-border p-2 rounded w-full text-sm" value={paso.condicion_decision} onChange={e => actualizarPaso(idx, pidx, 'condicion_decision', e.target.value)} />
                                                            <input type="text" placeholder="Si cumple → va a" className="border border-border p-2 rounded w-full text-sm" value={paso.destino_si_cumple} onChange={e => actualizarPaso(idx, pidx, 'destino_si_cumple', e.target.value)} />
                                                            <input type="text" placeholder="Si NO cumple → va a" className="border border-border p-2 rounded w-full text-sm" value={paso.destino_si_no_cumple} onChange={e => actualizarPaso(idx, pidx, 'destino_si_no_cumple', e.target.value)} />
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="border-t border-border pt-2">
                                                    <label className="flex items-center gap-2 text-sm font-medium" style={{color: 'var(--color-warning)'}}>
                                                        <input type="checkbox" checked={paso.pasa_a_otra_area} onChange={e => actualizarPaso(idx, pidx, 'pasa_a_otra_area', e.target.checked)} className="rounded" />
                                                        Pasa a otra área (crea handoff automático)
                                                    </label>
                                                    {paso.pasa_a_otra_area && (
                                                        <div className="ml-6 mt-2 space-y-2 p-2 rounded border" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                                                            <input type="text" placeholder="Área destino" className="border border-border p-2 rounded w-full text-sm" value={paso.area_destino} onChange={e => actualizarPaso(idx, pidx, 'area_destino', e.target.value)} />
                                                            <input type="text" placeholder="¿Qué le envían?" className="border border-border p-2 rounded w-full text-sm" value={paso.que_envia} onChange={e => actualizarPaso(idx, pidx, 'que_envia', e.target.value)} />
                                                            <label className="flex items-center gap-2 text-sm text-text">
                                                                <input type="checkbox" checked={paso.espera_respuesta} onChange={e => actualizarPaso(idx, pidx, 'espera_respuesta', e.target.checked)} className="rounded" />
                                                                El proceso espera respuesta de esa área
                                                            </label>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="mb-8 p-4 border border-border rounded bg-surface">
                        <h3 className="font-bold text-lg mb-3 text-primary">Parte 4 y 5: Información Complementaria y Cierre</h3>
                        <div className="space-y-3">
                            <textarea placeholder="Interacciones con otras áreas (qué envían/reciben)" className="border border-border p-2 rounded w-full" rows="3" value={complemento.interacciones_externas} onChange={e => setComplemento({...complemento, interacciones_externas: e.target.value})} />
                            <textarea placeholder="Sistemas/herramientas que usan (Excel, Word, etc.)" className="border border-border p-2 rounded w-full" rows="2" value={complemento.sistemas_usados} onChange={e => setComplemento({...complemento, sistemas_usados: e.target.value})} />
                            <label className="flex items-center gap-2 text-text">
                                <input type="checkbox" checked={complemento.tiene_manuales} onChange={e => setComplemento({...complemento, tiene_manuales: e.target.checked})} className="rounded" />
                                Tienen manuales de procedimientos escritos
                            </label>
                            <input type="text" placeholder="Resolución/Formularios oficiales (número)" className="border border-border p-2 rounded w-full" value={complemento.resolucion_formularios} onChange={e => setComplemento({...complemento, resolucion_formularios: e.target.value})} />
                            <input type="text" placeholder="Entrevistado(s)" className="border border-border p-2 rounded w-full" value={complemento.entrevistados} onChange={e => setComplemento({...complemento, entrevistados: e.target.value})} />
                            <textarea placeholder="Acuerdos (ej: enviar resumen en 3 días)" className="border border-border p-2 rounded w-full" rows="2" value={complemento.acuerdos} onChange={e => setComplemento({...complemento, acuerdos: e.target.value})} />
                            <textarea placeholder="Observaciones generales" className="border border-border p-2 rounded w-full" rows="2" value={complemento.observaciones_generales} onChange={e => setComplemento({...complemento, observaciones_generales: e.target.value})} />
                        </div>
                    </div>
                    
                    <div className="text-center">
                        <button onClick={guardarEntrevista} disabled={loading} className={'px-6 py-3 rounded font-medium text-white ' + (loading ? 'bg-gray-400' : 'btn-success')}>
                            {loading ? 'Guardando...' : 'Guardar Entrevista Completa'}
                        </button>
                    </div>
                </div>
            );
        }

        function VerEntrevista({ entrevistaId, onCerrar, onVerDetalle }) {
            const [entrevista, setEntrevista] = useState(null);
            const [procesos, setProcesos] = useState([]);
            const [pasosPorProceso, setPasosPorProceso] = useState({});
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                if (!entrevistaId || typeof entrevistaId !== 'number') {
                    setLoading(false);
                    return;
                }
                async function cargar() {
                    try {
                        const { data: entData, error: entError } = await supabase
                            .from('entrevistas')
                            .select('*')
                            .eq('id', entrevistaId)
                            .single();
                        if (entError) {
                            alert("Error al cargar la entrevista: " + entError.message);
                            return;
                        }
                        if (!entData) return;
                        setEntrevista(entData);
                        
                        const { data: procData, error: procError } = await supabase
                            .from('procesos')
                            .select('*')
                            .eq('entrevista_id', entrevistaId);
                        if (procError) {
                            alert("Error al cargar los procesos: " + procError.message);
                            return;
                        }
                        setProcesos(procData || []);
                        
                        const pasosMap = {};
                        if (procData) {
                            for (const p of procData) {
                                const { data: pasosData, error: pasosError } = await supabase
                                    .from('pasos_proceso')
                                    .select('*')
                                    .eq('proceso_id', p.id)
                                    .order('orden', { ascending: true });
                                if (pasosError) {
                                    console.error(`Error al cargar pasos del proceso ${p.id}:`, pasosError);
                                } else {
                                    pasosMap[p.id] = pasosData || [];
                                }
                            }
                        }
                        setPasosPorProceso(pasosMap);
                    } catch (err) {
                        alert("Error inesperado: " + err.message);
                    } finally {
                        setLoading(false);
                    }
                }
                cargar();
            }, [entrevistaId]);
            
            if (loading) return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-surface p-6 rounded-lg border border-border max-w-md">
                        <p className="text-text">Cargando...</p>
                    </div>
                </div>
            );
            
            if (!entrevista) return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-surface p-6 rounded-lg border border-border max-w-md">
                        <p className="text-danger">Entrevista no encontrada</p>
                        <button onClick={onCerrar} className="mt-4 px-4 py-2 bg-gray-600 text-white rounded">Cerrar</button>
                    </div>
                </div>
            );
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-surface p-6 rounded-lg border border-border max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between mb-6">
                            <h2 className="text-2xl font-bold text-text">Entrevista: {entrevista.area}</h2>
                            <button onClick={onCerrar} className="text-text-secondary hover:text-text">
                                ✕
                            </button>
                        </div>
                        
                        <div className="mb-6 p-4 bg-surface rounded border border-border">
                            <div className="grid grid-cols-2 gap-4 text-text">
                                <div><strong>Fecha:</strong> {new Date(entrevista.fecha).toLocaleDateString('es-AR')}</div>
                                <div><strong>Hora:</strong> {entrevista.hora ? entrevista.hora.slice(0,5) : '—'}</div>
                                <div><strong>Entrevistador:</strong> {entrevista.entrevistador || '—'}</div>
                                <div><strong>Responsable:</strong> {entrevista.responsable || '—'}</div>
                                <div><strong>Estado:</strong> {entrevista.estado}</div>
                            </div>
                        </div>
                        
                        {(entrevista.interacciones_externas || entrevista.sistemas_usados || entrevista.entrevistados || entrevista.acuerdos || entrevista.observaciones_generales) && (
                            <div className="mb-6 p-4 card-info rounded border">
                                <h3 className="font-bold mb-2 text-text">Información complementaria</h3>
                                <div className="text-text text-sm space-y-1">
                                    {entrevista.interacciones_externas && <p><strong>Interacciones:</strong> {entrevista.interacciones_externas}</p>}
                                    {entrevista.sistemas_usados && <p><strong>Sistemas:</strong> {entrevista.sistemas_usados}</p>}
                                    {entrevista.entrevistados && <p><strong>Entrevistados:</strong> {entrevista.entrevistados}</p>}
                                    {entrevista.acuerdos && <p><strong>Acuerdos:</strong> {entrevista.acuerdos}</p>}
                                    {entrevista.observaciones_generales && <p><strong>Observaciones:</strong> {entrevista.observaciones_generales}</p>}
                                </div>
                            </div>
                        )}
                        
                        {procesos.length > 0 && (
                            <div>
                                <h3 className="font-bold text-lg mb-4 text-text">Procesos relevados</h3>
                                {procesos.map(p => (
                                    <div key={p.id} className="mb-6 p-4 border border-border rounded bg-surface">
                                        <div className="flex justify-between">
                                            <div>
                                                <h4 className="font-semibold text-lg text-text">{p.nombre}</h4>
                                                <div className="text-sm text-text-secondary mb-2">{p.area_inicio} → {p.area_cierre || '...'}</div>
                                            </div>
                                            <button onClick={() => onVerDetalle(p.id)} className="btn-primary px-3 py-1 rounded text-sm flex items-center gap-1">
                                                <Icons.Eye /> Ver Detalle
                                            </button>
                                        </div>
                                        <div className="space-y-3 mt-3">
                                            {pasosPorProceso[p.id]?.map(paso => (
                                                <div key={paso.id} className="p-3 bg-surface rounded border border-border">
                                                    <div className="text-text"><span className="font-medium">Paso {paso.orden}:</span> {paso.descripcion}</div>
                                                    {paso.responsable_rol && <div className="text-text-secondary text-sm">Responsable: {paso.responsable_rol}</div>}
                                                    {paso.area && <div className="text-text-secondary text-sm">Área: {paso.area}</div>}
                                                    {paso.herramienta && <div className="text-text-secondary text-sm">Herramienta: {paso.herramienta}</div>}
                                                    {paso.tiene_decision && (
                                                        <div className="mt-2 p-2 card-warning rounded border">
                                                            <div className="text-text text-sm"><strong>Decisión:</strong> {paso.condicion_decision}</div>
                                                            {paso.destino_si_cumple && <div className="text-success text-sm">✓ Sí: {paso.destino_si_cumple}</div>}
                                                            {paso.destino_si_no_cumple && <div className="text-danger text-sm">✗ No: {paso.destino_si_no_cumple}</div>}
                                                        </div>
                                                    )}
                                                    {paso.pasa_a_otra_area && (
                                                        <div className="mt-2 p-2 rounded border" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                                                            <div className="text-text text-sm">🔄 Pasa a: {paso.area_destino}</div>
                                                            {paso.que_envia && <div className="text-text-secondary text-sm">Envía: {paso.que_envia}</div>}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        <div className="mt-6 flex justify-end">
                            <button onClick={onCerrar} className="px-4 py-2 bg-gray-600 text-white rounded">
                                Cerrar
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function ListaEntrevistas({ entrevistas, onVer, onEditarEstado }) {
            return (
                <div className="space-y-3">
                    {entrevistas.map(e => (
                        <div key={e.id} className="bg-surface p-4 rounded border border-border">
                            <h4 className="font-semibold text-text">{e.area}</h4>
                            <p className="text-sm text-text-secondary">
                                {new Date(e.fecha).toLocaleDateString('es-AR')} {e.hora ? `a las ${e.hora.slice(0,5)}` : ''}
                            </p>
                            <p className="text-sm mt-1 text-text">Estado: <span className="font-medium">{e.estado}</span></p>
                            <div className="mt-2 flex gap-2">
                                <button
                                    onClick={() => onVer(e.id)}
                                    className="text-primary text-sm hover:underline"
                                >
                                    Ver
                                </button>
                                <select
                                    value={e.estado}
                                    onChange={ev => onEditarEstado(e.id, ev.target.value)}
                                    className="text-sm border border-border rounded px-2"
                                >
                                    <option value="pendiente">Pendiente</option>
                                    <option value="realizada">Realizada</option>
                                    <option value="validada">Validada</option>
                                    <option value="requiere_seguimiento">Seguimiento</option>
                                </select>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function DetalleProceso({ procesoId, onVolver }) {
            const [proceso, setProceso] = useState(null);
            const [entrevista, setEntrevista] = useState(null);
            const [pasos, setPasos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [mermaidSvg, setMermaidSvg] = useState('');
            const diagramRef = useRef(null);
            
            useEffect(() => {
                let cancelado = false;
                async function cargar() {
                    try {
                        const { data: proc } = await supabase.from('procesos').select('*').eq('id', procesoId).single();
                        if (!proc || cancelado) return;
                        setProceso(proc);
                        
                        const { data: ent } = await supabase.from('entrevistas').select('*').eq('id', proc.entrevista_id).single();
                        if (!cancelado) setEntrevista(ent);
                        
                        const { data: pasosData } = await supabase.from('pasos_proceso').select('*').eq('proceso_id', procesoId).order('orden');
                        if (!cancelado) setPasos(pasosData || []);
                    } catch (err) { console.error(err); }
                    finally { if (!cancelado) setLoading(false); }
                }
                cargar();
                return () => { cancelado = true; };
            }, [procesoId]);
            
            useEffect(() => {
                if (loading || !pasos.length || !window.mermaid || !diagramRef.current) return;
                
                const renderDiagram = async () => {
                    const escape = (s) => (s || '').replace(/"/g, '\\"').replace(/\n/g, ' ');
                    let code = `graph TD\n  Inicio((Inicio)):::inicio\n  Fin((Fin)):::fin\n`;
                    let last = 'Inicio';
                    
                    pasos.forEach((p, i) => {
                        const id = `P${i+1}`;
                        code += `  ${id}["${escape(p.descripcion)}"]:::paso\n  ${last} --> ${id}\n`;
                        
                        if (p.tiene_decision) {
                            const c = `C${i+1}`;
                            code += `  ${c}{${escape(p.condicion_decision)}}:::decision\n  ${id} --> ${c}\n`;
                            if (p.destino_si_cumple) code += `  ${c} -->|Sí| SI${i+1}["${escape(p.destino_si_cumple)}"]:::destino\n`;
                            if (p.destino_si_no_cumple) code += `  ${c} -->|No| NO${i+1}["${escape(p.destino_si_no_cumple)}"]:::destino\n`;
                        } else if (p.pasa_a_otra_area && p.area_destino) {
                            code += `  ${id} --> H${i+1}["→ ${escape(p.area_destino)}"]:::handoff\n`;
                        } else if (i === pasos.length - 1) {
                            code += `  ${id} --> Fin\n`;
                        }
                        last = id;
                    });
                    
                    code += `\n  classDef inicio fill:#1e40af,color:white\n  classDef fin fill:#16a34a,color:white\n  classDef paso fill:#dbeafe,stroke:#3b82f6\n  classDef decision fill:#fef3c7,stroke:#f59e0b,stroke-dasharray:5,5\n  classDef destino fill:#fecaca,stroke:#ef4444\n  classDef handoff fill:#fff7ed,stroke:#ea580c\n`;
                    
                    try {
                        const { svg } = await window.mermaid.render(`diag-${procesoId}`, code);
                        setMermaidSvg(svg);
                    } catch (err) {
                        console.error('Mermaid error:', err);
                        setMermaidSvg(`<div class="text-danger p-4">Error: ${err.message}</div>`);
                    }
                };
                
                const timer = setTimeout(renderDiagram, 100);
                return () => clearTimeout(timer);
            }, [loading, pasos, procesoId]);
            
            if (loading) return <div className="p-6 text-center text-text">Cargando detalles del proceso...</div>;
            if (!proceso) return <div className="p-6 text-center text-text">Proceso no encontrado</div>;
            
            return (
                <div className="bg-surface p-6 rounded border border-border max-w-6xl mx-auto">
                    <div className="flex justify-between mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-text">{proceso.nombre}</h2>
                            <p className="text-sm text-text-secondary mt-1">
                                {proceso.area_inicio}
                                {proceso.areas_intermedias && ` → ${proceso.areas_intermedias}`}
                                {proceso.area_cierre && ` → ${proceso.area_cierre}`}
                            </p>
                        </div>
                        <button onClick={onVolver} className="text-primary hover:underline">Volver</button>
                    </div>
                    
                    {entrevista && (
                        <div className="mb-6 p-4 card-info rounded border">
                            <h3 className="font-bold text-lg mb-2 text-text">Entrevista asociada</h3>
                            <div className="grid grid-cols-2 gap-3 text-sm text-text">
                                <div><strong>Área:</strong> {entrevista.area}</div>
                                <div><strong>Fecha:</strong> {new Date(entrevista.fecha).toLocaleDateString('es-AR')}</div>
                                {entrevista.hora && <div><strong>Hora:</strong> {entrevista.hora.slice(0, 5)}</div>}
                                <div><strong>Entrevistador:</strong> {entrevista.entrevistador || '—'}</div>
                                <div><strong>Responsable:</strong> {entrevista.responsable || '—'}</div>
                                <div><strong>Estado:</strong> {entrevista.estado}</div>
                            </div>
                        </div>
                    )}
                    
                    <div className="grid grid-cols-3 gap-4 mb-6 p-4 bg-surface rounded border border-border">
                        <div><span className="text-sm text-text-secondary">Frecuencia:</span> <p className="font-medium capitalize text-text">{proceso.frecuencia}</p></div>
                        <div><span className="text-sm text-text-secondary">Prioridad:</span> <p className="font-medium capitalize text-text">{proceso.prioridad}</p></div>
                        <div><span className="text-sm text-text-secondary">Estado:</span> <p className="font-medium capitalize text-text">{proceso.estado_relevamiento?.replace('_', ' ')}</p></div>
                    </div>
                    
                    <div className="mb-6">
                        <h3 className="font-bold text-lg mb-4 text-text">Diagrama de Flujo (Visual)</h3>
                        {pasos.length === 0 ? (
                            <p className="text-text-secondary italic">Este proceso no tiene pasos definidos.</p>
                        ) : (
                            <div className="space-y-4">
                                {pasos.map((paso, idx) => (
                                    <div key={paso.id}>
                                        <div className="flex items-start gap-4">
                                            <div className="flex-shrink-0 w-8 h-8 btn-primary rounded-full flex items-center justify-center font-bold text-white">
                                                {paso.orden}
                                            </div>
                                            <div className="flex-1 border-2 rounded-lg p-4 bg-surface border-border">
                                                <h4 className="font-semibold mb-2 text-text">{paso.descripcion}</h4>
                                                <div className="grid grid-cols-2 gap-3 text-sm">
                                                    {paso.responsable_rol && <div className="text-text"><span className="text-text-secondary">Responsable:</span> {paso.responsable_rol}</div>}
                                                    {paso.area && <div className="text-text"><span className="text-text-secondary">Área:</span> <span className="font-medium">{paso.area}</span></div>}
                                                    {paso.herramienta && <div className="text-text"><span className="text-text-secondary">Herramienta:</span> {paso.herramienta}</div>}
                                                    {paso.plazos && <div className="text-text"><span className="text-text-secondary">Plazo:</span> {paso.plazos}</div>}
                                                </div>
                                                {paso.datos_necesarios && <div className="mt-2 text-sm text-text"><span className="text-text-secondary">Datos necesarios:</span> {paso.datos_necesarios}</div>}
                                                {paso.documentos_generados && <div className="mt-1 text-sm text-text"><span className="text-text-secondary">Documentos:</span> {paso.documentos_generados}</div>}
                                            </div>
                                        </div>
                                        {paso.tiene_decision && (
                                            <div className="ml-12 mt-2 mb-2">
                                                <div className="border-2 rounded-lg p-3 card-warning border" style={{borderColor: 'var(--color-warning)'}}>
                                                    <div className="font-semibold text-sm mb-2 text-text">Decisión: {paso.condicion_decision}</div>
                                                    <div className="flex gap-4 text-sm">
                                                        {paso.destino_si_cumple && <div className="flex-1 text-text"><span style={{color: 'var(--color-success)'}}>Sí cumple:</span> {paso.destino_si_cumple}</div>}
                                                        {paso.destino_si_no_cumple && <div className="flex-1 text-text"><span style={{color: 'var(--color-danger)'}}>Si no cumple:</span> {paso.destino_si_no_cumple}</div>}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        {paso.pasa_a_otra_area && paso.area_destino && (
                                            <div className="ml-12 mt-2 mb-2">
                                                <div className="border-2 rounded-lg p-3" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                                                    <div className="flex items-center gap-2 font-semibold text-sm mb-1 text-text">
                                                        Pasa a: <span style={{color: 'var(--color-warning)'}}>{paso.area_destino}</span>
                                                    </div>
                                                    {paso.que_envia && <div className="text-sm text-text">Envía: {paso.que_envia}</div>}
                                                    {paso.espera_respuesta && <div className="text-sm mt-1" style={{color: 'var(--color-warning)'}}>Espera respuesta</div>}
                                                </div>
                                            </div>
                                        )}
                                        {idx < pasos.length - 1 && <div className="ml-4 h-6 w-0.5 bg-border"></div>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    
                    <div className="mb-6">
                        <h3 className="font-bold text-lg mb-2 text-text">Diagrama UML (Mermaid)</h3>
<div ref={diagramRef} className="p-4 bg-surface rounded border border-border min-h-64 mermaid-diagram">
                            {mermaidSvg ? (
                                <div dangerouslySetInnerHTML={{ __html: mermaidSvg }} />
                            ) : (
                                <div className="text-text-secondary">Generando diagrama...</div>
                            )}
                        </div>
                    </div>
                    
                    <div className="mt-6 p-4 rounded border" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                        <h4 className="font-semibold mb-2 text-text">Handoffs en este proceso:</h4>
                        {pasos.filter(p => p.pasa_a_otra_area).length > 0 ? (
                            <ul className="text-sm space-y-1 text-text">
                                {pasos.filter(p => p.pasa_a_otra_area).map(p => (
                                    <li key={p.id}>• <strong>{p.area}</strong> → <strong>{p.area_destino}</strong> {p.que_envia && `(${p.que_envia})`}</li>
                                ))}
                            </ul>
                        ) : (
                            <p className="text-sm text-text-secondary">No hay transiciones entre áreas en este proceso.</p>
                        )}
                    </div>
                </div>
            );
        }

        function TrackerEntrevistas({ entrevistas, setEntrevistas, onCompletar }) {
            const [form, setForm] = useState({ area: '', fecha: '', hora: '', responsable: '', entrevistador: '', estado: 'pendiente', notas: '' });
            
            async function agregar() {
                if (!form.area || !form.fecha) return alert('Completa área y fecha');
                const { data, error } = await supabase.from('entrevistas').insert([form]).select();
                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    setEntrevistas([data[0], ...entrevistas]);
                    setForm({ area: '', fecha: '', hora: '', responsable: '', entrevistador: '', estado: 'pendiente', notas: '' });
                }
            }
            
            async function eliminar(id) {
                if (!confirm('Eliminar?')) return;
                const { error } = await supabase.from('entrevistas').delete().eq('id', id);
                if (!error) setEntrevistas(entrevistas.filter(e => e.id !== id));
            }
            
            const contarPorEstado = (estado) => entrevistas.filter(e => e.estado === estado).length;
            
            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-4 gap-4">
                        <div className="p-4 rounded border" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                            <div className="text-2xl font-bold" style={{color: 'var(--color-warning)'}}>{contarPorEstado('pendiente')}</div>
                            <div className="text-sm text-text">Pendientes</div>
                        </div>
                        <div className="card-info p-4 rounded border">
                            <div className="text-2xl font-bold text-primary">{contarPorEstado('realizada')}</div>
                            <div className="text-sm text-text">Realizadas</div>
                        </div>
                        <div className="card-success p-4 rounded border">
                            <div className="text-2xl font-bold text-success">{contarPorEstado('validada')}</div>
                            <div className="text-sm text-text">Validadas</div>
                        </div>
                        <div className="p-4 rounded border" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                            <div className="text-2xl font-bold" style={{color: 'var(--color-warning)'}}>{contarPorEstado('requiere_seguimiento')}</div>
                            <div className="text-sm text-text">Seguimiento</div>
                        </div>
                    </div>
                    
                    <div className="bg-surface p-4 rounded border border-border">
                        <h3 className="font-semibold mb-3 text-text">Nueva Entrevista</h3>
                        <div className="grid grid-cols-2 gap-3">
                            <input type="text" placeholder="Área *" className="border border-border p-2 rounded" value={form.area} onChange={e => setForm({ ...form, area: e.target.value })} />
                            <input type="date" className="border border-border p-2 rounded" value={form.fecha} onChange={e => setForm({ ...form, fecha: e.target.value })} />
                            <input type="time" className="border border-border p-2 rounded" value={form.hora} onChange={e => setForm({ ...form, hora: e.target.value })} />
                            <input type="text" placeholder="Responsable" className="border border-border p-2 rounded" value={form.responsable} onChange={e => setForm({ ...form, responsable: e.target.value })} />
                            <input type="text" placeholder="Entrevistador" className="border border-border p-2 rounded col-span-2" value={form.entrevistador} onChange={e => setForm({ ...form, entrevistador: e.target.value })} />
                        </div>
                        <button onClick={agregar} className="mt-3 btn-primary px-4 py-2 rounded flex items-center gap-2">
                            <Icons.Plus /> Agregar
                        </button>
                    </div>
                    
                    <div className="space-y-2">
                        {entrevistas.filter(e => e.estado === 'pendiente').map(e => (
                            <div key={e.id} className="bg-surface p-4 rounded border border-border">
                                <div className="flex justify-between">
                                    <div>
                                        <h4 className="font-semibold text-text">{e.area}</h4>
                                        <p className="text-sm text-text-secondary">{new Date(e.fecha).toLocaleDateString('es-AR')} {e.hora ? `a las ${e.hora.slice(0,5)}` : ''}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => onCompletar(e.id)} className="btn-success px-3 py-1 rounded text-sm">
                                            Completar
                                        </button>
                                        <button onClick={() => eliminar(e.id)} className="btn-danger p-2 rounded">
                                            <Icons.Trash />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function MatrizProcesos({ procesos, onVerDetalle, onEditar }) {
            return (
                <div className="bg-surface rounded border border-border overflow-hidden">
                    <table className="w-full">
                        <thead className="bg-surface border-b border-border">
                            <tr>
                                <th className="text-left p-3 text-text font-semibold">Proceso</th>
                                <th className="text-left p-3 text-text font-semibold">Flujo</th>
                                <th className="text-left p-3 text-text font-semibold">Frecuencia</th>
                                <th className="text-left p-3 text-text font-semibold">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {procesos.map(p => (
                                <tr key={p.id} className="border-t border-border">
                                    <td className="p-3 font-medium text-text">{p.nombre}</td>
                                    <td className="p-3 text-sm text-text-secondary">{p.area_inicio} → {p.area_cierre || '...'}</td>
                                    <td className="p-3 text-sm text-text-secondary capitalize">{p.frecuencia}</td>
                                    <td className="p-3">
                                        <div className="flex gap-2">
                                            <button onClick={() => onVerDetalle(p.id)} className="btn-primary px-3 py-1 rounded text-sm flex items-center gap-1">
                                                <Icons.Eye /> Ver
                                            </button>
                                            <button onClick={() => onEditar(p.id)} className="px-3 py-1 rounded text-sm flex items-center gap-1 text-white" style={{backgroundColor: 'var(--color-warning)'}}>
                                                <Icons.Edit /> Editar
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function ValidacionHandoffs({ handoffs, onRecargar }) {
            async function toggleValidacion(id, campo, valorActual) {
                await supabase.from('handoffs').update({ [campo]: !valorActual }).eq('id', id);
                if (onRecargar) onRecargar();
            }
            
            return (
                <div className="space-y-3">
                    {handoffs.map(h => (
                        <div key={h.id} className="bg-surface p-4 rounded border border-border">
                            <h4 className="font-semibold text-text">{h.proceso}</h4>
                            <div className="flex items-center gap-2 text-sm text-text-secondary mt-1">
                                <span className="font-medium">{h.area_origen}</span>
                                <Icons.ArrowRight />
                                <span className="font-medium">{h.area_destino}</span>
                            </div>
                            {h.que_se_envia && <p className="text-sm mt-2 text-text">{h.que_se_envia}</p>}
                            <div className="mt-3 flex gap-4">
                                <label className="flex items-center gap-2 text-sm cursor-pointer text-text">
                                    <input type="checkbox" checked={h.validado_por_origen} onChange={() => toggleValidacion(h.id, 'validado_por_origen', h.validado_por_origen)} />
                                    Validado por {h.area_origen}
                                </label>
                                <label className="flex items-center gap-2 text-sm cursor-pointer text-text">
                                    <input type="checkbox" checked={h.validado_por_destino} onChange={() => toggleValidacion(h.id, 'validado_por_destino', h.validado_por_destino)} />
                                    Validado por {h.area_destino}
                                </label>
                            </div>
                            {h.validado_por_origen && h.validado_por_destino && (
                                <div className="mt-2 px-3 py-1 rounded text-sm flex items-center gap-2 card-success border">
                                    <Icons.Check /> <span className="text-text">Validado por ambas áreas</span>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        function EditarProceso({ procesoId, onCerrar }) {
            const [proceso, setProceso] = useState(null);
            const [pasos, setPasos] = useState([]);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                async function cargar() {
                    try {
                        const { data: procData } = await supabase.from('procesos').select('*').eq('id', procesoId).single();
                        if (!procData) return;
                        setProceso(procData);
                        
                        const { data: pasosData } = await supabase.from('pasos_proceso').select('*').eq('proceso_id', procesoId).order('orden', { ascending: true });
                        setPasos(pasosData || []);
                    } catch (err) {
                        console.error('Error al cargar proceso:', err);
                    } finally {
                        setLoading(false);
                    }
                }
                cargar();
            }, [procesoId]);
            
            const handleChangeProceso = (campo, valor) => {
                setProceso(prev => ({ ...prev, [campo]: valor }));
            };
            
            const handleActualizarPaso = (index, campo, valor) => {
                const nuevos = [...pasos];
                nuevos[index] = { ...nuevos[index], [campo]: valor };
                setPasos(nuevos);
            };
            
            const handleAgregarPaso = () => {
                const nuevoPaso = {
                    descripcion: '',
                    responsable_rol: '',
                    area: '',
                    herramienta: '',
                    es_manual: true,
                    datos_necesarios: '',
                    documentos_generados: '',
                    plazos: '',
                    tiene_decision: false,
                    condicion_decision: '',
                    destino_si_cumple: '',
                    destino_si_no_cumple: '',
                    pasa_a_otra_area: false,
                    area_destino: '',
                    que_envia: '',
                    espera_respuesta: false
                };
                setPasos([...pasos, nuevoPaso]);
            };
            
            const handleEliminarPaso = (index) => {
                setPasos(pasos.filter((_, i) => i !== index));
            };
            
            const handleGuardar = async () => {
                if (!proceso) return;
                try {
                    await supabase.from('procesos').update({
                        nombre: proceso.nombre,
                        frecuencia: proceso.frecuencia,
                        prioridad: proceso.prioridad,
                        area_inicio: proceso.area_inicio,
                        areas_intermedias: proceso.areas_intermedias,
                        area_cierre: proceso.area_cierre,
                        estado_relevamiento: proceso.estado_relevamiento
                    }).eq('id', proceso.id);
                    
                    for (const paso of pasos) {
                        if (paso.id) {
                            await supabase.from('pasos_proceso').update({
                                descripcion: paso.descripcion,
                                responsable_rol: paso.responsable_rol,
                                area: paso.area,
                                herramienta: paso.herramienta,
                                es_manual: paso.es_manual,
                                datos_necesarios: paso.datos_necesarios,
                                documentos_generados: paso.documentos_generados,
                                plazos: paso.plazos,
                                tiene_decision: paso.tiene_decision,
                                condicion_decision: paso.condicion_decision,
                                destino_si_cumple: paso.destino_si_cumple,
                                destino_si_no_cumple: paso.destino_si_no_cumple,
                                pasa_a_otra_area: paso.pasa_a_otra_area,
                                area_destino: paso.area_destino,
                                que_envia: paso.que_envia,
                                espera_respuesta: paso.espera_respuesta
                            }).eq('id', paso.id);
                        } else {
                            await supabase.from('pasos_proceso').insert([{
                                proceso_id: proceso.id,
                                orden: paso.orden || pasos.indexOf(paso) + 1,
                                descripcion: paso.descripcion,
                                responsable_rol: paso.responsable_rol,
                                area: paso.area,
                                herramienta: paso.herramienta,
                                es_manual: paso.es_manual,
                                datos_necesarios: paso.datos_necesarios,
                                documentos_generados: paso.documentos_generados,
                                plazos: paso.plazos,
                                tiene_decision: paso.tiene_decision,
                                condicion_decision: paso.condicion_decision,
                                destino_si_cumple: paso.destino_si_cumple,
                                destino_si_no_cumple: paso.destino_si_no_cumple,
                                pasa_a_otra_area: paso.pasa_a_otra_area,
                                area_destino: paso.area_destino,
                                que_envia: paso.que_envia,
                                espera_respuesta: paso.espera_respuesta
                            }]);
                        }
                    }
                    alert('Proceso actualizado exitosamente');
                    onCerrar();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };
            
            if (loading) return <div className="p-6 text-center text-text">Cargando...</div>;
            if (!proceso) return <div className="p-6 text-center text-text">Proceso no encontrado</div>;
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-surface p-6 rounded-lg border border-border max-w-6xl w-full max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between mb-6">
                            <h2 className="text-2xl font-bold text-text">Editar Proceso</h2>
                            <button onClick={onCerrar} className="text-text-secondary hover:text-text">
                                ✕
                            </button>
                        </div>
                        
                        <div className="mb-6 p-4 bg-surface rounded border border-border">
                            <h3 className="font-bold text-lg mb-3 text-text">Datos del Proceso</h3>
                            <div className="grid grid-cols-3 gap-3">
                                <input type="text" placeholder="Nombre" className="border border-border p-2 rounded" value={proceso.nombre || ''} onChange={e => handleChangeProceso('nombre', e.target.value)} />
                                <select className="border border-border p-2 rounded" value={proceso.frecuencia || 'mensual'} onChange={e => handleChangeProceso('frecuencia', e.target.value)}>
                                    <option value="diaria">Diaria</option>
                                    <option value="semanal">Semanal</option>
                                    <option value="mensual">Mensual</option>
                                    <option value="eventual">Eventual</option>
                                </select>
                                <select className="border border-border p-2 rounded" value={proceso.prioridad || 'media'} onChange={e => handleChangeProceso('prioridad', e.target.value)}>
                                    <option value="baja">Baja</option>
                                    <option value="media">Media</option>
                                    <option value="alta">Alta</option>
                                </select>
                                <input type="text" placeholder="Área inicio" className="border border-border p-2 rounded" value={proceso.area_inicio || ''} onChange={e => handleChangeProceso('area_inicio', e.target.value)} />
