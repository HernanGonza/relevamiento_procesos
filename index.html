<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevamiento de Procesos - Ministerio de Ecología</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mermaid v11 ESM (compatible con Babel) -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
        mermaid.initialize({ startOnLoad: false });
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://ketmsuhhyymhprwvoxjx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtldG1zdWhoeXltaHByd3ZveGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3ODExODksImV4cCI6MjA3NzM1NzE4OX0.R6sOE9UofsP8NZnhc4uFJF3hTauEjvGJjnoSYtIifbQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const Icons = {
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            ArrowRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Alert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            Eye: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
        };
        // ========== COMPONENTES ==========
        function FormularioEntrevista({ entrevistaId, onVolver }) {
            const [loading, setLoading] = useState(false);
            const [entrevista, setEntrevista] = useState(null);
            const [procesos, setProcesos] = useState([{
                nombre: '', frecuencia: 'mensual', prioridad: 'media',
                area_inicio: '', areas_intermedias: '', area_cierre: '',
                pasos: [{
                    descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true,
                    datos_necesarios: '', documentos_generados: '', plazos: '',
                    tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '',
                    pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false
                }]
            }]);
            const [complemento, setComplemento] = useState({
                publico_usuarios: [],
                interacciones_externas: '',
                sistemas_usados: '',
                tiene_manuales: false,
                resolucion_formularios: '',
                entrevistados: '',
                acuerdos: '',
                observaciones_generales: ''
            });
            useEffect(() => {
                if (entrevistaId) {
                    supabase.from('entrevistas').select('*').eq('id', entrevistaId).single().then(({ data }) => {
                        if (data) {
                            setEntrevista(data);
                            if (data.publico_usuarios) {
                                setComplemento(prev => ({ ...prev, publico_usuarios: data.publico_usuarios }));
                            }
                        }
                    });
                }
            }, [entrevistaId]);
            const publicoOpciones = ['Ciudadanos', 'Empresas privadas', 'Municipios', 'ONGs', 'Otras áreas del Ministerio', 'Otros organismos provinciales', 'Organismos nacionales', 'Otros'];
            const togglePublico = (valor) => {
                setComplemento(prev => {
                    const lista = [...prev.publico_usuarios];
                    if (lista.includes(valor)) {
                        return { ...prev, publico_usuarios: lista.filter(x => x !== valor) };
                    } else {
                        return { ...prev, publico_usuarios: [...lista, valor] };
                    }
                });
            };
            const agregarProceso = () => {
                setProcesos([...procesos, {
                    nombre: '', frecuencia: 'mensual', prioridad: 'media',
                    area_inicio: '', areas_intermedias: '', area_cierre: '',
                    pasos: [{ descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true, datos_necesarios: '', documentos_generados: '', plazos: '', tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '', pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false }]
                }]);
            };
            const eliminarProceso = (index) => {
                setProcesos(procesos.filter((_, i) => i !== index));
            };
            const actualizarProceso = (index, campo, valor) => {
                const nuevos = [...procesos];
                nuevos[index] = { ...nuevos[index], [campo]: valor };
                setProcesos(nuevos);
            };
            const agregarPaso = (procIndex) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos.push({ descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true, datos_necesarios: '', documentos_generados: '', plazos: '', tiene_decision: false, condicion_decision: '', destino_si_cumple: '', destino_si_no_cumple: '', pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false });
                setProcesos(nuevos);
            };
            const eliminarPaso = (procIndex, pasoIndex) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos = nuevos[procIndex].pasos.filter((_, i) => i !== pasoIndex);
                setProcesos(nuevos);
            };
            const actualizarPaso = (procIndex, pasoIndex, campo, valor) => {
                const nuevos = [...procesos];
                nuevos[procIndex].pasos[pasoIndex] = { ...nuevos[procIndex].pasos[pasoIndex], [campo]: valor };
                setProcesos(nuevos);
            };
            async function guardarEntrevista() {
                if (!entrevista) return;
                setLoading(true);
                try {
                    await supabase.from('entrevistas').update({
                        estado: 'realizada',
                        publico_usuarios: complemento.publico_usuarios.length ? complemento.publico_usuarios : null,
                        interacciones_externas: complemento.interacciones_externas || null,
                        sistemas_usados: complemento.sistemas_usados || null,
                        tiene_manuales: complemento.tiene_manuales,
                        resolucion_formularios: complemento.resolucion_formularios || null,
                        entrevistados: complemento.entrevistados || null,
                        acuerdos: complemento.acuerdos || null,
                        observaciones_generales: complemento.observaciones_generales || null
                    }).eq('id', entrevista.id);
                    for (const proc of procesos) {
                        if (!proc.nombre || !proc.area_inicio) continue;
                        const { data, error } = await supabase.from('procesos').insert([{
                            nombre: proc.nombre,
                            frecuencia: proc.frecuencia,
                            prioridad: proc.prioridad,
                            area_inicio: proc.area_inicio,
                            areas_intermedias: proc.areas_intermedias || null,
                            area_cierre: proc.area_cierre || null,
                            estado_relevamiento: 'en_proceso',
                            entrevista_id: entrevista.id
                        }]).select();
                        if (error) throw error;
                        const procesoId = data[0].id;
                        for (let i = 0; i < proc.pasos.length; i++) {
                            const paso = proc.pasos[i];
                            if (!paso.descripcion) continue;
                            await supabase.from('pasos_proceso').insert({
                                proceso_id: procesoId,
                                orden: i + 1,
                                descripcion: paso.descripcion,
                                responsable_rol: paso.responsable_rol || null,
                                area: paso.area || null,
                                herramienta: paso.herramienta || null,
                                es_manual: paso.es_manual,
                                datos_necesarios: paso.datos_necesarios || null,
                                documentos_generados: paso.documentos_generados || null,
                                plazos: paso.plazos || null,
                                tiene_decision: paso.tiene_decision,
                                condicion_decision: paso.condicion_decision || null,
                                destino_si_cumple: paso.destino_si_cumple || null,
                                destino_si_no_cumple: paso.destino_si_no_cumple || null,
                                pasa_a_otra_area: paso.pasa_a_otra_area,
                                area_destino: paso.area_destino || null,
                                que_envia: paso.que_envia || null,
                                espera_respuesta: paso.espera_respuesta
                            });
                            if (paso.pasa_a_otra_area && paso.area_destino && paso.area) {
                                await supabase.from('handoffs').insert({
                                    proceso: proc.nombre,
                                    area_origen: paso.area,
                                    area_destino: paso.area_destino,
                                    que_se_envia: paso.que_envia || null,
                                    validado_por_origen: false,
                                    validado_por_destino: false,
                                    entrevista_id: entrevista.id
                                });
                            }
                        }
                    }
                    alert('Entrevista guardada exitosamente');
                    if (onVolver) onVolver();
                } catch (error) {
                    alert('Error: ' + error.message);
                } finally {
                    setLoading(false);
                }
            }
            if (!entrevista) return <div className="p-6">Cargando...</div>;
            return (
                <div className="bg-white p-6 rounded-lg border max-w-6xl mx-auto">
                    <div className="flex justify-between mb-6">
                        <h2 className="text-2xl font-bold">Formulario Completo de Entrevista</h2>
                        <button onClick={onVolver} className="text-blue-600 hover:underline">Volver</button>
                    </div>
                    <div className="mb-8 p-4 border rounded bg-gray-50">
                        <h3 className="font-bold text-lg mb-3 text-blue-900">Parte 1: Identificación del Área</h3>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <div><strong>Área:</strong> {entrevista.area}</div>
                            <div><strong>Fecha:</strong> {new Date(entrevista.fecha).toLocaleDateString('es-AR')}</div>
                            <div><strong>Hora:</strong> {entrevista.hora ? entrevista.hora.slice(0, 5) : '–'}</div>
                            <div><strong>Responsable:</strong> {entrevista.responsable || '–'}</div>
                            <div><strong>Entrevistador:</strong> {entrevista.entrevistador || '–'}</div>
                        </div>
                        <div className="mt-4">
                            <p className="font-medium mb-2">Público/Usuarios:</p>
                            <div className="flex flex-wrap gap-2">
                                {publicoOpciones.map(opt => (
                                    <label key={opt} className="flex items-center gap-1 text-sm">
                                        <input type="checkbox" checked={complemento.publico_usuarios.includes(opt)} onChange={() => togglePublico(opt)} className="rounded" />
                                        {opt}
                                    </label>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="mb-8">
                        <div className="flex justify-between mb-4">
                            <h3 className="font-bold text-lg text-blue-900">Parte 2 y 3: Procesos y Pasos Detallados</h3>
                            <button onClick={agregarProceso} className="bg-blue-600 text-white px-3 py-1 rounded text-sm flex items-center gap-1">
                                <Icons.Plus /> Agregar Proceso
                            </button>
                        </div>
                        {procesos.map((proc, idx) => (
                            <div key={idx} className="mb-6 p-4 border-2 rounded-lg bg-blue-50 border-blue-200">
                                <div className="flex justify-between mb-3">
                                    <h4 className="font-semibold text-lg">Proceso #{idx + 1}</h4>
                                    {procesos.length > 1 && (
                                        <button onClick={() => eliminarProceso(idx)} className="text-red-600 hover:bg-red-100 p-1 rounded">
                                            <Icons.Trash />
                                        </button>
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <input type="text" placeholder="Nombre del proceso *" className="border p-2 rounded" value={proc.nombre} onChange={e => actualizarProceso(idx, 'nombre', e.target.value)} />
                                    <select className="border p-2 rounded" value={proc.frecuencia} onChange={e => actualizarProceso(idx, 'frecuencia', e.target.value)}>
                                        <option value="diaria">Diaria</option>
                                        <option value="semanal">Semanal</option>
                                        <option value="mensual">Mensual</option>
                                        <option value="eventual">Eventual</option>
                                    </select>
                                    <select className="border p-2 rounded" value={proc.prioridad} onChange={e => actualizarProceso(idx, 'prioridad', e.target.value)}>
                                        <option value="baja">Prioridad Baja</option>
                                        <option value="media">Prioridad Media</option>
                                        <option value="alta">Prioridad Alta</option>
                                    </select>
                                    <input type="text" placeholder="Área que inicia *" className="border p-2 rounded" value={proc.area_inicio} onChange={e => actualizarProceso(idx, 'area_inicio', e.target.value)} />
                                    <input type="text" placeholder="Áreas intermedias (separadas por coma)" className="border p-2 rounded" value={proc.areas_intermedias} onChange={e => actualizarProceso(idx, 'areas_intermedias', e.target.value)} />
                                    <input type="text" placeholder="Área que cierra" className="border p-2 rounded" value={proc.area_cierre} onChange={e => actualizarProceso(idx, 'area_cierre', e.target.value)} />
                                </div>
                                <div className="mt-4">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-medium text-sm">Pasos del proceso:</span>
                                        <button onClick={() => agregarPaso(idx)} className="bg-green-600 text-white px-2 py-1 rounded text-xs flex items-center gap-1">
                                            <Icons.Plus /> Agregar Paso
                                        </button>
                                    </div>
                                    {proc.pasos.map((paso, pidx) => (
                                        <div key={pidx} className="mb-3 p-3 border rounded bg-white shadow-sm">
                                            <div className="flex justify-between mb-2">
                                                <span className="text-sm font-semibold bg-blue-100 px-2 py-1 rounded">Paso {pidx + 1}</span>
                                                {proc.pasos.length > 1 && (
                                                    <button onClick={() => eliminarPaso(idx, pidx)} className="text-red-600 hover:bg-red-100 p-1 rounded">
                                                        <Icons.Trash />
                                                    </button>
                                                )}
                                            </div>
                                            <div className="space-y-2">
                                                <input type="text" placeholder="¿Qué se hace?" className="border p-2 rounded w-full text-sm" value={paso.descripcion} onChange={e => actualizarPaso(idx, pidx, 'descripcion', e.target.value)} />
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="text" placeholder="¿Quién lo hace? (rol)" className="border p-2 rounded text-sm" value={paso.responsable_rol} onChange={e => actualizarPaso(idx, pidx, 'responsable_rol', e.target.value)} />
                                                    <input type="text" placeholder="Área donde se realiza" className="border p-2 rounded text-sm" value={paso.area} onChange={e => actualizarPaso(idx, pidx, 'area', e.target.value)} />
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="text" placeholder="Herramienta/sistema" className="border p-2 rounded text-sm" value={paso.herramienta} onChange={e => actualizarPaso(idx, pidx, 'herramienta', e.target.value)} />
                                                    <label className="flex items-center gap-2 text-sm border p-2 rounded bg-gray-50">
                                                        <input type="checkbox" checked={paso.es_manual} onChange={e => actualizarPaso(idx, pidx, 'es_manual', e.target.checked)} className="rounded" />
                                                        Es manual
                                                    </label>
                                                </div>
                                                <input type="text" placeholder="Datos necesarios" className="border p-2 rounded w-full text-sm" value={paso.datos_necesarios} onChange={e => actualizarPaso(idx, pidx, 'datos_necesarios', e.target.value)} />
                                                <input type="text" placeholder="Documentos generados" className="border p-2 rounded w-full text-sm" value={paso.documentos_generados} onChange={e => actualizarPaso(idx, pidx, 'documentos_generados', e.target.value)} />
                                                <input type="text" placeholder="Plazos" className="border p-2 rounded w-full text-sm" value={paso.plazos} onChange={e => actualizarPaso(idx, pidx, 'plazos', e.target.value)} />
                                                <div className="border-t pt-2">
                                                    <label className="flex items-center gap-2 text-sm font-medium">
                                                        <input type="checkbox" checked={paso.tiene_decision} onChange={e => actualizarPaso(idx, pidx, 'tiene_decision', e.target.checked)} className="rounded" />
                                                        Tiene punto de decisión
                                                    </label>
                                                    {paso.tiene_decision && (
                                                        <div className="ml-6 mt-2 space-y-2 bg-yellow-50 p-2 rounded">
                                                            <input type="text" placeholder="Condición a evaluar" className="border p-2 rounded w-full text-sm" value={paso.condicion_decision} onChange={e => actualizarPaso(idx, pidx, 'condicion_decision', e.target.value)} />
                                                            <input type="text" placeholder="Si cumple → va a" className="border p-2 rounded w-full text-sm" value={paso.destino_si_cumple} onChange={e => actualizarPaso(idx, pidx, 'destino_si_cumple', e.target.value)} />
                                                            <input type="text" placeholder="Si NO cumple → va a" className="border p-2 rounded w-full text-sm" value={paso.destino_si_no_cumple} onChange={e => actualizarPaso(idx, pidx, 'destino_si_no_cumple', e.target.value)} />
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="border-t pt-2">
                                                    <label className="flex items-center gap-2 text-sm font-medium text-orange-700">
                                                        <input type="checkbox" checked={paso.pasa_a_otra_area} onChange={e => actualizarPaso(idx, pidx, 'pasa_a_otra_area', e.target.checked)} className="rounded" />
                                                        Pasa a otra área (crea handoff automático)
                                                    </label>
                                                    {paso.pasa_a_otra_area && (
                                                        <div className="ml-6 mt-2 space-y-2 bg-orange-50 p-2 rounded border border-orange-200">
                                                            <input type="text" placeholder="Área destino" className="border p-2 rounded w-full text-sm" value={paso.area_destino} onChange={e => actualizarPaso(idx, pidx, 'area_destino', e.target.value)} />
                                                            <input type="text" placeholder="¿Qué le envían?" className="border p-2 rounded w-full text-sm" value={paso.que_envia} onChange={e => actualizarPaso(idx, pidx, 'que_envia', e.target.value)} />
                                                            <label className="flex items-center gap-2 text-sm">
                                                                <input type="checkbox" checked={paso.espera_respuesta} onChange={e => actualizarPaso(idx, pidx, 'espera_respuesta', e.target.checked)} className="rounded" />
                                                                El proceso espera respuesta de esa área
                                                            </label>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mb-8 p-4 border rounded bg-gray-50">
                        <h3 className="font-bold text-lg mb-3 text-blue-900">Parte 4 y 5: Información Complementaria y Cierre</h3>
                        <div className="space-y-3">
                            <textarea placeholder="Interacciones con otras áreas (qué envían/reciben)" className="border p-2 rounded w-full" rows="3" value={complemento.interacciones_externas} onChange={e => setComplemento({...complemento, interacciones_externas: e.target.value})} />
                            <textarea placeholder="Sistemas/herramientas que usan (Excel, Word, etc.)" className="border p-2 rounded w-full" rows="2" value={complemento.sistemas_usados} onChange={e => setComplemento({...complemento, sistemas_usados: e.target.value})} />
                            <label className="flex items-center gap-2">
                                <input type="checkbox" checked={complemento.tiene_manuales} onChange={e => setComplemento({...complemento, tiene_manuales: e.target.checked})} className="rounded" />
                                Tienen manuales de procedimientos escritos
                            </label>
                            <input type="text" placeholder="Resolución/Formularios oficiales (número)" className="border p-2 rounded w-full" value={complemento.resolucion_formularios} onChange={e => setComplemento({...complemento, resolucion_formularios: e.target.value})} />
                            <input type="text" placeholder="Entrevistado(s)" className="border p-2 rounded w-full" value={complemento.entrevistados} onChange={e => setComplemento({...complemento, entrevistados: e.target.value})} />
                            <textarea placeholder="Acuerdos (ej: enviar resumen en 3 días)" className="border p-2 rounded w-full" rows="2" value={complemento.acuerdos} onChange={e => setComplemento({...complemento, acuerdos: e.target.value})} />
                            <textarea placeholder="Observaciones generales" className="border p-2 rounded w-full" rows="2" value={complemento.observaciones_generales} onChange={e => setComplemento({...complemento, observaciones_generales: e.target.value})} />
                        </div>
                    </div>
                    <div className="text-center">
                        <button onClick={guardarEntrevista} disabled={loading} className={'px-6 py-3 rounded font-medium text-white ' + (loading ? 'bg-gray-400' : 'bg-green-600 hover:bg-green-700')}>
                            {loading ? 'Guardando...' : 'Guardar Entrevista Completa'}
                        </button>
                    </div>
                </div>
            );
        }
        function VerEntrevista({ entrevistaId, onVolver }) {
            const [entrevista, setEntrevista] = useState(null);
            const [procesos, setProcesos] = useState([]);
            const [pasosPorProceso, setPasosPorProceso] = useState({});
            const [loading, setLoading] = useState(true);
            useEffect(() => {
                async function cargar() {
                    const { data: entData } = await supabase.from('entrevistas').select('*').eq('id', entrevistaId).single();

            useEffect(() => {

                async function cargar() {
                    try {
                        const { data: proc } = await supabase.from('procesos').select('*').eq('id', procesoId).single();
                        if (!proc || cancelado) return;

                        const { data: ent } = await supabase.from('entrevistas').select('*').eq('id', proc.entrevista_id).single();
                        if (!cancelado) setEntrevista(ent);

                        if (!cancelado) setPasos(pasosData || []);

            useEffect(() => {

                const renderDiagram = async () => {
                    const escape = (s) => (s || '').replace(/"/g, '\\"').replace(/\n/g, ' ');
                    let code = `graph TD\n  Inicio((Inicio)):::inicio\n  Fin((Fin)):::fin\n`;
                    let last = 'Inicio';

                    pasos.forEach((p, i) => {
                        const id = `P${i+1}`;
                        code += `  ${id}["${escape(p.descripcion)}"]:::paso\n  ${last} --> ${id}\n`;

                            const c = `C${i+1}`;
                            code += `  ${c}{${escape(p.condicion_decision)}}:::decision\n  ${id} --> ${c}\n`;
                            if (p.destino_si_cumple) code += `  ${c} -->|Sí| SI${i+1}["${escape(p.destino_si_cumple)}"]:::destino\n`;
                            if (p.destino_si_no_cumple) code += `  ${c} -->|No| NO${i+1}["${escape(p.destino_si_no_cumple)}"]:::destino\n`;
                        } else if (p.pasa_a_otra_area && p.area_destino) {
                            code += `  ${id} --> H${i+1}["→ ${escape(p.area_destino)}"]:::handoff\n`;
                        } else if (i === pasos.length - 1) {
                            code += `  ${id} --> Fin\n`;
                        }
                        last = id;
                    });

                    code += `\n  classDef inicio fill:#1e40af,color:white\n  classDef fin fill:#16a34a,color:white\n  classDef paso fill:#dbeafe,stroke:#3b82f6\n  classDef decision fill:#fef3c7,stroke:#f59e0b,stroke-dasharray:5,5\n  classDef destino fill:#fecaca,stroke:#ef4444\n  classDef handoff fill:#fff7ed,stroke:#ea580c\n`;

                        setMermaidSvg(`<div class="text-red-600 p-4">Error: ${err.message}</div>`);

                    </div>
                    <div className="mb-6">

                        {pasos.length === 0 ? (

            const [entrevistaSeleccionada, setEntrevistaSeleccionada] = useState(null);
            useEffect(() => {
                loadData();
            }, []);
            async function loadData() {
                try {
                    const [e, p, h] = await Promise.all([
                        supabase.from('entrevistas').select('*').order('fecha', { ascending: false }),
                        supabase.from('procesos').select('*').order('created_at', { ascending: false }),
                        supabase.from('handoffs').select('*').order('created_at', { ascending: false })
                    ]);
                    if (e.data) setEntrevistas(e.data);
                    if (p.data) setProcesos(p.data);
                    if (h.data) setHandoffs(h.data);
                } catch (error) {
                    console.error('Error:', error);
                } finally {
                    setLoading(false);
                }
            }
            async function editarEstadoEntrevista(id, nuevoEstado) {
                await supabase.from('entrevistas').update({ estado: nuevoEstado }).eq('id', id);
                loadData();
            }
            function iniciarCompletar(id) {
                setEntrevistaEnProgreso(id);
                setActiveTab('completar');
            }
            function verEntrevista(id) {
                setEntrevistaSeleccionada(id);
                setActiveTab('ver-entrevista');
            }
            function verDetalleProceso(id) {
                setProcesoSeleccionado(id);
                setActiveTab('detalle-proceso');
            }
            if (loading) return <div className="p-6 text-center">Cargando...</div>;
            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-6">
                            <h1 className="text-3xl font-bold">Sistema de Relevamiento de Procesos</h1>
                            <p className="text-gray-600 mt-1">Ministerio de Ecología - Provincia de Misiones</p>
                        </div>
                        {activeTab !== 'completar' && activeTab !== 'detalle-proceso' && activeTab !== 'ver-entrevista' && (
                            <div className="flex gap-2 mb-6 border-b">
                                <button onClick={() => setActiveTab('tracker')} className={'px-4 py-2 font-medium ' + (activeTab === 'tracker' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600')}>
                                    Agendar Entrevistas
                                </button>
                                <button onClick={() => setActiveTab('entrevistas')} className={'px-4 py-2 font-medium ' + (activeTab === 'entrevistas' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600')}>
                                    Entrevistas ({entrevistas.length})
                                </button>
                                <button onClick={() => setActiveTab('procesos')} className={'px-4 py-2 font-medium ' + (activeTab === 'procesos' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600')}>
                                    Procesos ({procesos.length})
                                </button>
                                <button onClick={() => setActiveTab('handoffs')} className={'px-4 py-2 font-medium ' + (activeTab === 'handoffs' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600')}>
                                    Handoffs ({handoffs.length})
                                </button>
                            </div>
                        )}
                        <div>
                            {activeTab === 'tracker' && (
                                <TrackerEntrevistas
                                    entrevistas={entrevistas}
                                    setEntrevistas={setEntrevistas}
                                    onCompletar={iniciarCompletar}
                                />
                            )}
                            {activeTab === 'entrevistas' && (
                                <ListaEntrevistas
                                    entrevistas={entrevistas}
                                    onVer={verEntrevista}
                                    onEditarEstado={editarEstadoEntrevista}
                                />
                            )}
                            {activeTab === 'completar' && (
                                <FormularioEntrevista
                                    entrevistaId={entrevistaEnProgreso}
                                    onVolver={() => setActiveTab('tracker')}
                                />
                            )}
                            {activeTab === 'ver-entrevista' && (
                                <VerEntrevista
                                    entrevistaId={entrevistaSeleccionada}
                                    onVolver={() => setActiveTab('entrevistas')}
                                />
                            )}
                            {activeTab === 'procesos' && (
                                <MatrizProcesos
                                    procesos={procesos}
                                    onVerDetalle={verDetalleProceso}
                                />
                            )}
                            {activeTab === 'detalle-proceso' && (
                                <DetalleProceso
                                    procesoId={procesoSeleccionado}
                                    onVolver={() => setActiveTab('procesos')}
                                />
                            )}
                            {activeTab === 'handoffs' && (
                                <ValidacionHandoffs
                                    handoffs={handoffs}
                                    onRecargar={loadData}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
