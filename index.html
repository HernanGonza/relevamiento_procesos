                                <input type="text" placeholder="Áreas intermedias" className="border border-border p-2 rounded" value={proceso.areas_intermedias || ''} onChange={e => handleChangeProceso('areas_intermedias', e.target.value)} />
                                <input type="text" placeholder="Área cierre" className="border border-border p-2 rounded" value={proceso.area_cierre || ''} onChange={e => handleChangeProceso('area_cierre', e.target.value)} />
                            </div>
                        </div>
                        
                        <div className="mb-6">
                            <div className="flex justify-between mb-4">
                                <h3 className="font-bold text-lg text-text">Pasos del Proceso</h3>
                                <button onClick={handleAgregarPaso} className="btn-primary px-3 py-1 rounded text-sm flex items-center gap-1">
                                    <Icons.Plus /> Agregar Paso
                                </button>
                            </div>
                            {pasos.map((paso, idx) => (
                                <div key={idx} className="mb-4 p-4 border border-border rounded bg-surface shadow-sm">
                                    <div className="flex justify-between mb-3">
                                        <h4 className="font-semibold text-text">Paso {idx + 1}</h4>
                                        <button onClick={() => handleEliminarPaso(idx)} className="btn-danger">
                                            <Icons.Trash />
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 text-sm">
                                        <input type="text" placeholder="Descripción" className="border border-border p-2 rounded" value={paso.descripcion || ''} onChange={e => handleActualizarPaso(idx, 'descripcion', e.target.value)} />
                                        <input type="text" placeholder="Responsable (rol)" className="border border-border p-2 rounded" value={paso.responsable_rol || ''} onChange={e => handleActualizarPaso(idx, 'responsable_rol', e.target.value)} />
                                        <input type="text" placeholder="Área" className="border border-border p-2 rounded" value={paso.area || ''} onChange={e => handleActualizarPaso(idx, 'area', e.target.value)} />
                                        <input type="text" placeholder="Herramienta" className="border border-border p-2 rounded" value={paso.herramienta || ''} onChange={e => handleActualizarPaso(idx, 'herramienta', e.target.value)} />
                                        <input type="text" placeholder="Datos necesarios" className="border border-border p-2 rounded" value={paso.datos_necesarios || ''} onChange={e => handleActualizarPaso(idx, 'datos_necesarios', e.target.value)} />
                                        <input type="text" placeholder="Documentos generados" className="border border-border p-2 rounded" value={paso.documentos_generados || ''} onChange={e => handleActualizarPaso(idx, 'documentos_generados', e.target.value)} />
                                        <input type="text" placeholder="Plazos" className="border border-border p-2 rounded" value={paso.plazos || ''} onChange={e => handleActualizarPaso(idx, 'plazos', e.target.value)} />
                                    </div>
                                    <div className="mt-3">
                                        <label className="flex items-center gap-2 text-sm text-text">
                                            <input type="checkbox" checked={paso.tiene_decision} onChange={e => handleActualizarPaso(idx, 'tiene_decision', e.target.checked)} className="rounded" />
                                            Tiene punto de decisión
                                        </label>
                                        {paso.tiene_decision && (
                                            <div className="mt-2 p-2 card-warning rounded border">
                                                <input type="text" placeholder="Condición a evaluar" className="border border-border p-2 rounded w-full mb-1" value={paso.condicion_decision || ''} onChange={e => handleActualizarPaso(idx, 'condicion_decision', e.target.value)} />
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="text" placeholder="Destino si cumple" className="border border-border p-2 rounded" value={paso.destino_si_cumple || ''} onChange={e => handleActualizarPaso(idx, 'destino_si_cumple', e.target.value)} />
                                                    <input type="text" placeholder="Destino si no cumple" className="border border-border p-2 rounded" value={paso.destino_si_no_cumple || ''} onChange={e => handleActualizarPaso(idx, 'destino_si_no_cumple', e.target.value)} />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-3">
                                        <label className="flex items-center gap-2 text-sm text-text">
                                            <input type="checkbox" checked={paso.pasa_a_otra_area} onChange={e => handleActualizarPaso(idx, 'pasa_a_otra_area', e.target.checked)} className="rounded" />
                                            🔄 Pasa a otra área
                                        </label>
                                        {paso.pasa_a_otra_area && (
                                            <div className="mt-2 p-2 rounded border" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                                                <input type="text" placeholder="Área destino" className="border border-border p-2 rounded w-full mb-1" value={paso.area_destino || ''} onChange={e => handleActualizarPaso(idx, 'area_destino', e.target.value)} />
                                                <input type="text" placeholder="Qué envía" className="border border-border p-2 rounded w-full mb-1" value={paso.que_envia || ''} onChange={e => handleActualizarPaso(idx, 'que_envia', e.target.value)} />
                                                <label className="flex items-center gap-2 text-sm text-text">
                                                    <input type="checkbox" checked={paso.espera_respuesta} onChange={e => handleActualizarPaso(idx, 'espera_respuesta', e.target.checked)} className="rounded" />
                                                    El proceso espera respuesta
                                                </label>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="flex justify-end gap-3">
                            <button onClick={onCerrar} className="px-4 py-2 rounded font-medium text-text-secondary border border-border bg-surface">
                                Cancelar
                            </button>
                            <button onClick={handleGuardar} className="px-4 py-2 rounded font-medium text-white btn-success">
                                Guardar Cambios
                            </button>
                        </div>
                    </div>

        function App() {
            const [activeTab, setActiveTab] = useState('tracker');
            const [entrevistas, setEntrevistas] = useState([]);
            const [procesos, setProcesos] = useState([]);
            const [handoffs, setHandoffs] = useState([]);

            const [darkMode, setDarkMode] = useState(true);
            
            useEffect(() => {
                loadData();
                if (darkMode) {
                    document.body.classList.add('dark');
                } else {
                    document.body.classList.remove('dark');
                }
            }, [darkMode]);
            
            async function loadData() {
                try {
                    const [e, p, h] = await Promise.all([
                        supabase.from('entrevistas').select('*').order('fecha', { ascending: false }),
                        supabase.from('procesos').select('*').order('created_at', { ascending: false }),
                        supabase.from('handoffs').select('*').order('created_at', { ascending: false })
                    ]);
                    if (e.data) setEntrevistas(e.data);
                    if (p.data) setProcesos(p.data);
                    if (h.data) setHandoffs(h.data);
                } catch (error) {
                    console.error('Error:', error);
                } finally {
                    setLoading(false);
                }
            }
            
            async function editarEstadoEntrevista(id, nuevoEstado) {
                await supabase.from('entrevistas').update({ estado: nuevoEstado }).eq('id', id);
                loadData();
            }

                setEntrevistaEnProgreso(id);
                setActiveTab('completar');
            }
            
            function verEntrevista(id) {
                setEntrevistaAVer(id);
                setActiveTab('ver-entrevista-modal');
            }
            
            function verDetalleProceso(id) {
                setProcesoSeleccionado(id);
                setActiveTab('detalle-proceso');
            }
            
            function editarProceso(id) {
                setProcesoAEliminar(id);
                setActiveTab('editar-proceso');
            }

                            </div>

                                    entrevistaId={entrevistaEnProgreso}

                                />
                            )}
                            {activeTab === 'ver-entrevista-modal' && (
                                <VerEntrevista

                                    onCerrar={() => {

                                        setActiveTab('entrevistas');

                                    onVerDetalle={(id) => {

                                    }}

                            )}

                                    onVolver={() => setActiveTab('procesos')}

                                    procesoId={procesoAEliminar}
                                    onCerrar={() => {
                                        setProcesoAEliminar(null);
                                        setActiveTab('procesos');
                                        loadData();
                                    }}
                                />
                            )}
                            {activeTab === 'procesos' && (
                                <MatrizProcesos
                                    procesos={procesos}
                                    onVerDetalle={verDetalleProceso}
                                    onEditar={editarProceso}
                                />
                            )}
                            {activeTab === 'handoffs' && (
                                <ValidacionHandoffs
                                    handoffs={handoffs}
                                    onRecargar={loadData}
                                />
                            )}
                            {activeTab === 'generador' && (
    <GeneradorSistema
        onVolver={() => setActiveTab('tracker')}
    />
)}
                            
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
