   function FormularioEntrevista({ entrevistaId, onVolver }) {
    const [loading, setLoading] = useState(false);
    const [entrevista, setEntrevista] = useState(null);
    const [procesos, setProcesos] = useState([{
        nombre: '', frecuencia: 'mensual', prioridad: 'media',
        area_inicio: '', areas_intermedias: '', area_cierre: '',
        volumen_mensual: '', normativa: '', reporte_obligatorio: false,
        potencial_digital: 'parcial', documento_final: '', proceso_padre: '', aprobador_final: '',
        pasos: []
    }]);
    const [complemento, setComplemento] = useState({
        publico_usuarios: [], interacciones_externas: '', sistemas_usados: '',
        tiene_manuales: false, resolucion_formularios: '', entrevistados: '',
        acuerdos: '', observaciones_generales: ''
    });

    const tempIdCounter = useRef(0);

    useEffect(() => {
        if (entrevistaId) {
            supabase.from('entrevistas').select('*').eq('id', entrevistaId).single().then(({ data }) => {
                if (data) {
                    setEntrevista(data);
                    if (data.publico_usuarios) {
                        setComplemento(prev => ({ ...prev, publico_usuarios: data.publico_usuarios }));
                    }
                }
            });
        }
    }, [entrevistaId]);

    const publicoOpciones = ['Ciudadanos', 'Empresas privadas', 'Municipios', 'ONGs', 'Otras áreas del Ministerio', 'Otros organismos provinciales', 'Organismos nacionales', 'Otros'];
    const togglePublico = (valor) => {
        setComplemento(prev => {
            const lista = [...prev.publico_usuarios];
            if (lista.includes(valor)) {
                return { ...prev, publico_usuarios: lista.filter(x => x !== valor) };
            } else {
                return { ...prev, publico_usuarios: [...lista, valor] };
            }
        });
    };

    const agregarProceso = () => {
        setProcesos([...procesos, {
            nombre: '', frecuencia: 'mensual', prioridad: 'media',
            area_inicio: '', areas_intermedias: '', area_cierre: '',
            volumen_mensual: '', normativa: '', reporte_obligatorio: false,
            potencial_digital: 'parcial', documento_final: '', proceso_padre: '', aprobador_final: '',
            pasos: []
        }]);
    };

    const eliminarProceso = (index) => {
        setProcesos(procesos.filter((_, i) => i !== index));
    };

    const actualizarProceso = (index, campo, valor) => {
        const nuevos = [...procesos];
        nuevos[index] = { ...nuevos[index], [campo]: valor };
        setProcesos(nuevos);
    };

    const addPaso = (procIndex, parentId, branchType) => {
        const nuevos = [...procesos];
        const procPasos = nuevos[procIndex].pasos;
        const siblings = procPasos.filter(p => p.parentId === parentId && p.branchType === branchType);
        const newOrden = siblings.length + 1;

        const tempId = `temp_${tempIdCounter.current++}`;

        const newStep = {
            id: tempId,
            parentId,
            branchType: branchType || 'linear',
            orden: newOrden,
            descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true,
            datos_necesarios: '', documentos_generados: '', plazos: '', tiempo_promedio: '',
            riesgos: '', tiene_decision: false, condicion_decision: '',
            pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false,
            es_paso_final: false
        };
        procPasos.push(newStep);
        setProcesos(nuevos);
    };

    const eliminarPaso = (procIndex, stepId) => {
        const nuevos = [...procesos];
        const procPasos = nuevos[procIndex].pasos;
        const toRemove = [];
        const findDescendants = (id) => {
            toRemove.push(id);
            procPasos.forEach(s => {
                if (s.parentId === id) findDescendants(s.id);
            });
        };
        findDescendants(stepId);
        nuevos[procIndex].pasos = procPasos.filter(s => !toRemove.includes(s.id));
        setProcesos(nuevos);
    };

    const actualizarPaso = (procIndex, stepId, campo, valor) => {
        const nuevos = [...procesos];
        const procPasos = nuevos[procIndex].pasos;
        const updatedPasos = procPasos.map(s => s.id === stepId ? { ...s, [campo]: valor } : s);
        nuevos[procIndex].pasos = updatedPasos;
        setProcesos(nuevos);
    };

    async function guardarEntrevista() {
        if (!entrevista) return;
        setLoading(true);
        try {
            await supabase.from('entrevistas').update({
                estado: 'realizada',
                publico_usuarios: complemento.publico_usuarios.length ? complemento.publico_usuarios : null,
                interacciones_externas: complemento.interacciones_externas || null,
                sistemas_usados: complemento.sistemas_usados || null,
                tiene_manuales: complemento.tiene_manuales,
                resolucion_formularios: complemento.resolucion_formularios || null,
                entrevistados: complemento.entrevistados || null,
                acuerdos: complemento.acuerdos || null,
                observaciones_generales: complemento.observaciones_generales || null
            }).eq('id', entrevista.id);

            for (const proc of procesos) {
                if (!proc.nombre || !proc.area_inicio) continue;
                const { data, error } = await supabase.from('procesos').insert([{
                    nombre: proc.nombre,
                    frecuencia: proc.frecuencia,
                    prioridad: proc.prioridad,
                    area_inicio: proc.area_inicio,
                    areas_intermedias: proc.areas_intermedias || null,
                    area_cierre: proc.area_cierre || null,
                    volumen_mensual: proc.volumen_mensual || null,
                    normativa: proc.normativa || null,
                    reporte_obligatorio: proc.reporte_obligatorio,
                    potencial_digital: proc.potencial_digital,
                    documento_final: proc.documento_final || null,
                    proceso_padre: proc.proceso_padre || null,
                    aprobador_final: proc.aprobador_final || null,
                    estado_relevamiento: 'en_proceso',
                    entrevista_id: entrevista.id
                }]).select();

                if (error) throw error;
                const procesoId = data[0].id;

                const allSteps = proc.pasos;
                const localToDb = {};
                const insertData = allSteps.map(s => ({
                    proceso_id: procesoId,
                    orden: s.orden,
                    descripcion: s.descripcion,
                    responsable_rol: s.responsable_rol || null,
                    area: s.area || null,
                    herramienta: s.herramienta || null,
                    es_manual: s.es_manual,
                    datos_necesarios: s.datos_necesarios || null,
                    documentos_generados: s.documentos_generados || null,
                    plazos: s.plazos || null,
                    tiempo_promedio: s.tiempo_promedio || null,
                    riesgos: s.riesgos || null,
                    tiene_decision: s.tiene_decision,
                    condicion_decision: s.condicion_decision || null,
                    pasa_a_otra_area: s.pasa_a_otra_area,
                    area_destino: s.area_destino || null,
                    que_envia: s.que_envia || null,
                    espera_respuesta: s.espera_respuesta,
                    es_paso_final: s.es_paso_final || false,
                    branch_type: s.branchType || null,
                    parent_id: null
                }));

                const { data: insertedData } = await supabase.from('pasos_proceso').insert(insertData).select();
                allSteps.forEach((s, i) => {
                    localToDb[s.id] = insertedData[i].id;
                });

                for (const s of allSteps) {
                    const dbId = localToDb[s.id];
                    const dbParent = s.parentId ? localToDb[s.parentId] : null;
                    await supabase.from('pasos_proceso').update({
                        parent_id: dbParent
                    }).eq('id', dbId);
                }

                for (const step of allSteps) {
                    if (step.pasa_a_otra_area && step.area_destino && step.area) {
                        await supabase.from('handoffs').insert({
                            proceso: proc.nombre,
                            area_origen: step.area,
                            area_destino: step.area_destino,
                            que_se_envia: step.que_envia || null,
                            validado_por_origen: false,
                            validado_por_destino: false,
                            entrevista_id: entrevista.id
                        });
                    }
                }
            }
            alert('Entrevista guardada exitosamente');
            if (onVolver) onVolver();
        } catch (error) {
            alert('Error: ' + error.message);
        } finally {
            setLoading(false);
        }
    }

    const StepTree = React.memo(({ procIndex, pasos, parentId, branchType, level = 0 }) => {
        const currentBranchType = branchType || 'linear';
        const childSteps = useMemo(() => 
            pasos.filter(p => p.parentId === parentId && p.branchType === currentBranchType).sort((a, b) => a.orden - b.orden),
            [pasos, parentId, currentBranchType]
        );

        return (
            <div style={{ marginLeft: `${level * 20}px` }}>
                {childSteps.map((paso) => (
                    <div key={paso.id} className="mb-4 p-4 border border-border rounded bg-surface shadow-sm">
                        <div className="flex justify-between mb-2">
                            <span className="text-sm font-semibold badge-primary px-2 py-1 rounded">
                                Paso {typeof paso.id === 'number' ? `#${paso.id}` : '(nuevo)'}
                            </span>
                            <button onClick={() => eliminarPaso(procIndex, paso.id)} className="btn-danger p-1 rounded">
                                <Icons.Trash />
                            </button>
                        </div>
                        <div className="space-y-2">
                            <input type="text" placeholder="Descripción *" className="border border-border p-2 rounded w-full text-sm" value={paso.descripcion} onChange={e => actualizarPaso(procIndex, paso.id, 'descripcion', e.target.value)} />
                            <div className="grid grid-cols-2 gap-2">
                                <input type="text" placeholder="Responsable (rol)" className="border border-border p-2 rounded text-sm" value={paso.responsable_rol} onChange={e => actualizarPaso(procIndex, paso.id, 'responsable_rol', e.target.value)} />
                                <input type="text" placeholder="Área" className="border border-border p-2 rounded text-sm" value={paso.area} onChange={e => actualizarPaso(procIndex, paso.id, 'area', e.target.value)} />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <input type="text" placeholder="Herramienta" className="border border-border p-2 rounded text-sm" value={paso.herramienta} onChange={e => actualizarPaso(procIndex, paso.id, 'herramienta', e.target.value)} />
                                <label className="flex items-center gap-2 text-sm">
                                    <input type="checkbox" checked={paso.es_manual} onChange={e => actualizarPaso(procIndex, paso.id, 'es_manual', e.target.checked)} className="rounded" />
                                    Es manual
                                </label>
                            </div>
                            <input type="text" placeholder="Datos necesarios" className="border border-border p-2 rounded w-full text-sm" value={paso.datos_necesarios} onChange={e => actualizarPaso(procIndex, paso.id, 'datos_necesarios', e.target.value)} />
                            <input type="text" placeholder="Documentos generados" className="border border-border p-2 rounded w-full text-sm" value={paso.documentos_generados} onChange={e => actualizarPaso(procIndex, paso.id, 'documentos_generados', e.target.value)} />
                            <input type="text" placeholder="Plazos" className="border border-border p-2 rounded w-full text-sm" value={paso.plazos} onChange={e => actualizarPaso(procIndex, paso.id, 'plazos', e.target.value)} />
                            <input type="text" placeholder="Tiempo promedio" className="border border-border p-2 rounded w-full text-sm" value={paso.tiempo_promedio} onChange={e => actualizarPaso(procIndex, paso.id, 'tiempo_promedio', e.target.value)} />
                            <textarea placeholder="Riesgos" className="border border-border p-2 rounded w-full text-sm" rows="2" value={paso.riesgos} onChange={e => actualizarPaso(procIndex, paso.id, 'riesgos', e.target.value)} />

                            <div className="border-t border-border pt-2">

        const renderMermaid = async () => {
            let code = `graph TD\n  A[Inicio]:::inicio --> `;
            const escape = (s) => (s || '').replace(/"/g, '\\"').replace(/\n/g, ' ');

            const addStep = (step, fromId) => {
                const id = `S${step.id}`;
                code += `${fromId} --> ${id}["${escape(step.descripcion)}"]:::paso\n`;

                if (step.tiene_decision) {
                    const decisionId = `D${step.id}`;
                    code += `${id} --> ${decisionId}{${escape(step.condicion_decision)}}:::decision\n`;

                    const siSteps = pasos.filter(s => s.parent_id === step.id && s.branch_type === 'si');
                    const noSteps = pasos.filter(s => s.parent_id === step.id && s.branch_type === 'no');

                    if (siSteps.length > 0) {
                        siSteps.forEach(s => addStep(s, decisionId));
                    } else {
                        code += `${decisionId} -->|Sí| F[Fin]:::fin\n`;
                    }

                    if (noSteps.length > 0) {
                        noSteps.forEach(s => addStep(s, decisionId));
                    } else {
                        code += `${decisionId} -->|No| F[Fin]:::fin\n`;
                    }
                } else if (step.es_paso_final) {
                    code += `${id} --> F[Fin]:::fin\n`;
                } else if (step.pasa_a_otra_area) {
                    const handoffId = `H${step.id}`;
                    code += `${id} --> ${handoffId}["→ ${escape(step.area_destino)}"]:::handoff\n`;
                    code += `${handoffId} --> F[Fin]:::fin\n`;
                } else {
                    const next = pasos.find(s => s.parent_id === step.id && !s.branch_type);
                    if (next) addStep(next, id);
                }
            };

            const root = pasos.find(s => !s.parent_id);
            if (root) addStep(root, 'A');
            else code += `A --> F[Fin]:::fin\n`;

            code += `classDef inicio fill:#10b981,stroke:#059669,color:white\n`;
            code += `classDef fin fill:#ef4444,stroke:#dc2626,color:white\n`;
            code += `classDef paso fill:#3b82f6,stroke:#2563eb,color:white\n`;
            code += `classDef decision fill:#f59e0b,stroke:#d97706,color:white\n`;
            code += `classDef handoff fill:#8b5cf6,stroke:#7c3aed,color:white\n`;

            const { svg } = await window.mermaid.render('mermaid-diagram', code);
            diagramRef.current.innerHTML = svg;
        };

        renderMermaid();
    }, [loading, pasos]);

    if (loading) return <div className="p-6 text-center">Cargando...</div>;
    if (!proceso) return <div className="p-6 text-center">No encontrado</div>;

    return (
        <div className="bg-surface p-6 rounded-lg border border-border max-w-6xl mx-auto">
            <button onClick={onVolver} className="mb-4 text-primary hover:underline">← Volver</button>
            <h2 className="text-2xl font-bold mb-4">{proceso.nombre}</h2>
            <div className="mb-6 grid grid-cols-2 gap-4 text-sm">
                <div><strong>Área inicio:</strong> {proceso.area_inicio}</div>
                <div><strong>Frecuencia:</strong> {proceso.frecuencia}</div>
                <div><strong>Prioridad:</strong> {proceso.prioridad}</div>
                <div><strong>Potencial digital:</strong> {proceso.potencial_digital}</div>
            </div>
            <div ref={diagramRef} className="mermaid-diagram"></div>
        </div>
    );
}

   function EditarProceso({ procesoId, onCerrar }) {
    const [proceso, setProceso] = useState(null);
    const [pasos, setPasos] = useState([]);
    const originalPasos = useRef([]);
    const [loading, setLoading] = useState(true);

    const tempIdCounter = useRef(0);

    useEffect(() => {
        async function cargar() {
            try {
                const { data: procData } = await supabase.from('procesos').select('*').eq('id', procesoId).single();
                if (!procData) throw new Error('Proceso no encontrado');
                const { data: pasosData } = await supabase.from('pasos_proceso').select('*').eq('proceso_id', procesoId);
                setProceso(procData);
                originalPasos.current = pasosData || [];
                setPasos((pasosData || []).map(p => ({
                    ...p,
                    id: p.id,
                    parentId: p.parent_id,
                    branchType: p.branch_type || 'linear'
                })));
            } catch (err) {
                alert('Error al cargar: ' + err.message);
            } finally {
                setLoading(false);
            }
        }
        cargar();
    }, [procesoId]);

    const handleChangeProceso = (campo, valor) => {
        setProceso(prev => ({ ...prev, [campo]: valor }));
    };

    const addPaso = (parentId, branchType) => {
        const siblings = pasos.filter(p => p.parentId === parentId && p.branchType === branchType);
        const newOrden = siblings.length + 1;
        const tempId = `temp_${tempIdCounter.current++}`;

        const newStep = {
            id: tempId,
            parentId,
            branchType: branchType || 'linear',
            orden: newOrden,
            descripcion: '', responsable_rol: '', area: '', herramienta: '', es_manual: true,
            datos_necesarios: '', documentos_generados: '', plazos: '',
            tiempo_promedio: '',
            riesgos: '',
            tiene_decision: false, condicion_decision: '',
            pasa_a_otra_area: false, area_destino: '', que_envia: '', espera_respuesta: false,
            es_paso_final: false
        };
        setPasos([...pasos, newStep]);
    };

    const eliminarPaso = (stepId) => {
        const toRemove = [];
        const findDescendants = (id) => {
            toRemove.push(id);
            pasos.forEach(s => {
                if (s.parentId === id) findDescendants(s.id);
            });
        };
        findDescendants(stepId);
        setPasos(pasos.filter(s => !toRemove.includes(s.id)));
    };

    const actualizarPaso = (stepId, campo, valor) => {
        setPasos(pasos.map(s => s.id === stepId ? { ...s, [campo]:
valor } : s));
    };

    const handleGuardar = async () => {
        if (!proceso) return;
        setLoading(true);
        try {
            await supabase.from('procesos').update({
                nombre: proceso.nombre,
                frecuencia: proceso.frecuencia,
                prioridad: proceso.prioridad,
                area_inicio: proceso.area_inicio,
                areas_intermedias: proceso.areas_intermedias,
                area_cierre: proceso.area_cierre,
                volumen_mensual: proceso.volumen_mensual,
                normativa: proceso.normativa,
                reporte_obligatorio: proceso.reporte_obligatorio,
                potencial_digital: proceso.potencial_digital,
                documento_final: proceso.documento_final,
                proceso_padre: proceso.proceso_padre,
                aprobador_final: proceso.aprobador_final,
                estado_relevamiento: proceso.estado_relevamiento
            }).eq('id', proceso.id);

            const currentDbIds = pasos.filter(s => typeof s.id === 'number').map(s => s.id);
            const deletedIds = originalPasos.current.filter(o => !currentDbIds.includes(o.id)).map(o => o.id);
            if (deletedIds.length > 0) {
                await supabase.from('pasos_proceso').delete().in('id', deletedIds);
            }

            const newSteps = pasos.filter(s => typeof s.id !== 'number');
            const localToDb = {};
            let insertedData = [];
            if (newSteps.length > 0) {
                const insertData = newSteps.map(s => ({
                    proceso_id: proceso.id,
                    orden: s.orden,
                    descripcion: s.descripcion,
                    responsable_rol: s.responsable_rol || null,
                    area: s.area || null,
                    herramienta: s.herramienta || null,
                    es_manual: s.es_manual,
                    datos_necesarios: s.datos_necesarios || null,
                    documentos_generados: s.documentos_generados || null,
                    plazos: s.plazos || null,
                    tiempo_promedio: s.tiempo_promedio || null,
                    riesgos: s.riesgos || null,
                    tiene_decision: s.tiene_decision,
                    condicion_decision: s.condicion_decision || null,
                    pasa_a_otra_area: s.pasa_a_otra_area,
                    area_destino: s.area_destino || null,
                    que_envia: s.que_envia || null,
                    espera_respuesta: s.espera_respuesta,
                    es_paso_final: s.es_paso_final || false,
                    branch_type: s.branchType || null,
                    parent_id: null
                }));
                const { data } = await supabase.from('pasos_proceso').insert(insertData).select();
                insertedData = data;
                newSteps.forEach((s, i) => {
                    localToDb[s.id] = insertedData[i].id;
                });
            }

            pasos.forEach(s => {
                if (typeof s.id === 'number') {
                    localToDb[s.id] = s.id;
                }
            });

            for (const s of pasos) {
                const dbId = localToDb[s.id];
                const dbParent = s.parentId ? localToDb[s.parentId] : null;
                await supabase.from('pasos_proceso').update({
                    orden: s.orden,
                    descripcion: s.descripcion,
                    responsable_rol: s.responsable_rol || null,
                    area: s.area || null,
                    herramienta: s.herramienta || null,
                    es_manual: s.es_manual,
                    datos_necesarios: s.datos_necesarios || null,
                    documentos_generados: s.documentos_generados || null,
                    plazos: s.plazos || null,
                    tiempo_promedio: s.tiempo_promedio || null,
                    riesgos: s.riesgos || null,
                    tiene_decision: s.tiene_decision,
                    condicion_decision: s.condicion_decision || null,
                    pasa_a_otra_area: s.pasa_a_otra_area,
                    area_destino: s.area_destino || null,
                    que_envia: s.que_envia || null,
                    espera_respuesta: s.espera_respuesta,
                    es_paso_final: s.es_paso_final || false,
                    branch_type: s.branchType || null,
                    parent_id: dbParent
                }).eq('id', dbId);
            }

            await supabase.from('handoffs').delete().eq('proceso', proceso.nombre);
            for (const step of pasos) {
                if (step.pasa_a_otra_area && step.area_destino && step.area) {
                    await supabase.from('handoffs').insert({
                        proceso: proceso.nombre,
                        area_origen: step.area,
                        area_destino: step.area_destino,
                        que_se_envia: step.que_envia || null,
                        validado_por_origen: false,
                        validado_por_destino: false,
                        entrevista_id: proceso.entrevista_id
                    });
                }
            }

            alert('Proceso actualizado exitosamente');
            onCerrar();
        } catch (err) {
            alert('Error: ' + err.message);
        } finally {
            setLoading(false);
        }
    };

    const StepTree = React.memo(({ pasos, parentId, branchType, level = 0 }) => {
        const currentBranchType = branchType || 'linear';
        const childSteps = useMemo(() => 
            pasos.filter(p => p.parentId === parentId && p.branchType === currentBranchType).sort((a, b) => a.orden - b.orden),
            [pasos, parentId, currentBranchType]
        );

        return (
            <div style={{ marginLeft: `${level * 20}px` }}>
                {childSteps.map((paso) => (
                    <div key={paso.id} className="mb-4 p-4 border border-border rounded bg-surface shadow-sm">
                        <div className="flex justify-between mb-2">
                            <span className="text-sm font-semibold badge-primary px-2 py-1 rounded">
                                Paso {typeof paso.id === 'number' ? `#${paso.id}` : '(nuevo)'}
                            </span>
                            <button onClick={() => eliminarPaso(paso.id)} className="btn-danger p-1 rounded">

                        </div>
                        <div className="space-y-2">
                            <input type="text" placeholder="Descripción *" className="border border-border p-2 rounded w-full text-sm" value={paso.descripcion} onChange={e => actualizarPaso(paso.id, 'descripcion', e.target.value)} />
                            <div className="grid grid-cols-2 gap-2">
                                <input type="text" placeholder="Responsable (rol)" className="border border-border p-2 rounded text-sm" value={paso.responsable_rol} onChange={e => actualizarPaso(paso.id, 'responsable_rol', e.target.value)} />

                            <div className="grid grid-cols-2 gap-2">
                                <input type="text" placeholder="Herramienta" className="border border-border p-2 rounded text-sm" value={paso.herramienta} onChange={e => actualizarPaso(paso.id, 'herramienta', e.target.value)} />
                                <label className="flex items-center gap-2 text-sm">
                                    <input type="checkbox" checked={paso.es_manual} onChange={e => actualizarPaso(paso.id, 'es_manual', e.target.checked)} className="rounded" />
                                    Es manual
                                </label>
                            </div>
                            <input type="text" placeholder="Datos necesarios" className="border border-border p-2 rounded w-full text-sm" value={paso.datos_necesarios} onChange={e => actualizarPaso(paso.id, 'datos_necesarios', e.target.value)} />
                            <input type="text" placeholder="Documentos generados" className="border border-border p-2 rounded w-full text-sm" value={paso.documentos_generados} onChange={e => actualizarPaso(paso.id, 'documentos_generados', e.target.value)} />
                            <input type="text" placeholder="Plazos" className="border border-border p-2 rounded w-full text-sm" value={paso.plazos} onChange={e => actualizarPaso(paso.id, 'plazos', e.target.value)} />

                                    <div className="ml-6 mt-2 space-y-2 card-warning p-2 rounded border">

                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <h5 className="text-sm font-bold">Sí</h5>
                                                <StepTree pasos={pasos} parentId={paso.id} branchType="si" level={level + 1} />
                                                <button onClick={() => addPaso(paso.id, 'si')} className="btn-success px-2 py-1 rounded text-xs mt-1">+ Sí</button>
                                            </div>
                                            <div className="flex-1">

                                    <input type="checkbox" checked={paso.pasa_a_otra_area} onChange={e => actualizarPaso(paso.id, 'pasa_a_otra_area', e.target.checked)} className="rounded" />
                                    Pasa a otra área
                                </label>
                                {paso.pasa_a_otra_area && (
                                    <div className="ml-6 mt-2 space-y-2 p-2 rounded border" style={{backgroundColor: 'var(--color-warning-light)', borderColor: 'var(--color-warning)'}}>
                                        <input type="text" placeholder="Área destino" className="border border-border p-2 rounded w-full text-sm" value={paso.area_destino} onChange={e => actualizarPaso(paso.id, 'area_destino', e.target.value)} />
                                        <input type="text" placeholder="¿Qué envía?" className="border border-border p-2 rounded w-full text-sm" value={paso.que_envia} onChange={e => actualizarPaso(paso.id, 'que_envia', e.target.value)} />
                                        <label className="flex items-center gap-2 text-sm">
                                            <input type="checkbox" checked={paso.espera_respuesta} onChange={e => actualizarPaso(paso.id, 'espera_respuesta', e.target.checked)} className="rounded" />
                                            Espera respuesta
                                        </label>
                                    </div>
                                )}
                            </div>
                            {/* PASO FINAL */}
                            <div className="border-t border-border pt-2 mt-2">
                                <label className="flex items-center gap-2 text-sm font-medium text-success">
                                    <input type="checkbox" checked={paso.es_paso_final} onChange={e => actualizarPaso(paso.id, 'es_paso_final', e.target.checked)} className="rounded" />
                                    Este paso finaliza el proceso
                                </label>
                                {paso.es_paso_final && (
                                    <div className="ml-6 mt-1 p-2 card-success rounded border text-sm">
                                        Proceso termina aquí
                                    </div>
                                )}
                            </div>
                            {/* Siguiente paso */}
                            {!paso.es_paso_final && !paso.tiene_decision && (
                                <div className="mt-2">
                                    <StepTree pasos={pasos} parentId={paso.id} branchType="linear" level={level + 1} />
                                    <button onClick={() => addPaso(paso.id, 'linear')} className="btn-success px-2 py-1 rounded text-xs flex items-center gap-1 mt-1">
                                        <Icons.Plus /> Siguiente Paso
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                ))}
            </div>
        );
    });

    if (loading) return <div className="p-6 text-center text-text">Cargando...</div>;
    if (!proceso) return <div className="p-6 text-center text-text">Proceso no encontrado</div>;

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 overflow-y-auto">
            <div className="bg-surface p-6 rounded-lg border border-border max-w-6xl w-full max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">

                    <select className="border border-border p-2 rounded" value={proceso.frecuencia} onChange={e => handleChangeProceso('frecuencia', e.target.value)}>

                        <option value="eventual">Eventual</option>

                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>
                    <input type="text" placeholder="Área inicio *" className="border border-border p-2 rounded" value={proceso.area_inicio} onChange={e => handleChangeProceso('area_inicio', e.target.value)} />
                    <input type="text" placeholder="Áreas intermedias" className="border border-border p-2 rounded" value={proceso.areas_intermedias || ''} onChange={e => handleChangeProceso('areas_intermedias', e.target.value)} />
                    <input type="text" placeholder="Área cierre" className="border border-border p-2 rounded" value={proceso.area_cierre || ''} onChange={e => handleChangeProceso('area_cierre', e.target.value)} />
                    <input type="number" placeholder="Volumen mensual" className="border border-border p-2 rounded" value={proceso.volumen_mensual || ''} onChange={e => handleChangeProceso('volumen_mensual', e.target.value)} />
                    <input type="text" placeholder="Normativa" className="border border-border p-2 rounded" value={proceso.normativa || ''} onChange={e => handleChangeProceso('normativa', e.target.value)} />
                    <label className="flex items-center gap-2 text-sm">
                        <input type="checkbox" checked={proceso.reporte_obligatorio} onChange={e => handleChangeProceso('reporte_obligatorio', e.target.checked)} className="rounded" />
                        Reporte obligatorio
                    </label>
                    <select className="border border-border p-2 rounded" value={proceso.potencial_digital} onChange={e => handleChangeProceso('potencial_digital', e.target.value)}>
                        <option value="si">100% digital</option>

                    </select>
                    <input type="text" placeholder="Documento final" className="border border-border p-2 rounded" value={proceso.documento_final || ''} onChange={e => handleChangeProceso('documento_final', e.target.value)} />
                    <input type="text" placeholder="Proceso padre" className="border border-border p-2 rounded" value={proceso.proceso_padre || ''} onChange={e => handleChangeProceso('proceso_padre', e.target.value)} />
                    <input type="text" placeholder="Aprobador final" className="border border-border p-2 rounded" value={proceso.aprobador_final || ''} onChange={e => handleChangeProceso('aprobador_final', e.target.value)} />
                </div>
                <div className="mb-6">
                    <div className="flex justify-between mb-2">
                        <h3 className="font-bold text-lg text-text">Pasos del Proceso</h3>
                        {pasos.filter(p => p.parentId === null).length === 0 && (
                            <button onClick={() => addPaso(null, 'linear')} className="btn-success px-2 py-1 rounded text-xs flex items-center gap-1">
                                <Icons.Plus /> Paso Inicial
                            </button>
                        )}
                    </div>
                    <StepTree pasos={pasos} parentId={null} branchType="linear" />
                </div>
                <div className="flex justify-end gap-3">
                    <button onClick={onCerrar} className="px-4 py-2 border border-border rounded text-text-secondary">Cancelar</button>
                    <button onClick={handleGuardar} disabled={loading} className="btn-success px-6 py-2 rounded font-medium">
                        {loading ? 'Guardando...' : 'Guardar Cambios'}
                    </button>
                </div>
            </div>
        </div>
    );
}
       function GeneradorSistema({ onVolver }) {
    const [procesos, setProcesos] = useState([]);
    const [procesoSeleccionado, setProcesoSeleccionado] = useState('');
    const [codigoGenerado, setCodigoGenerado] = useState(null);
    const [loading, setLoading] = useState(false);
    const [cargandoProcesos, setCargandoProcesos] = useState(true);

    useEffect(() => {
        async function cargarProcesos() {
            try {
                setCargandoProcesos(true);
                const { data, error } = await supabase
                    .from('procesos')
                    .select('id, nombre')
                    .order('nombre', { ascending: true });
                if (error) throw error;
                setProcesos(data || []);
            } catch (err) {
                alert('Error al cargar procesos: ' + err.message);
            } finally {
                setCargandoProcesos(false);
            }
        }
        cargarProcesos();
    }, []);

    const generarCodigo = async () => {
        if (!procesoSeleccionado) {
            alert('Selecciona un proceso');
            return;
        }
        setLoading(true);
        try {
            // CARGAR PROCESO COMPLETO CON TODOS LOS CAMPOS NUEVOS
            const { data: procData, error } = await supabase
                .from('procesos')
                .select(`
                    *,
                    pasos_proceso(*)
                `)
                .eq('id', procesoSeleccionado)
                .single();
            if (error) throw error;
            if (!procData) throw new Error('Proceso no encontrado');

            const nombreTabla = procData.nombre
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '');

            const pasos = procData.pasos_proceso || [];

            // === CAMPOS ÚNICOS DE DATOS NECESARIOS ===
            const camposUnicos = new Set();
            pasos.forEach(paso => {
                if (paso.datos_necesarios) {
                    paso.datos_necesarios
                        .split(',')
                        .map(c => c.trim())
                        .filter(Boolean)
                        .forEach(campo => {
                            const nombre = campo
                                .toLowerCase()
                                .replace(/[^a-z0-9]+/g, '_')
                                .replace(/^_+|_+$/g, '');
                            if (nombre) camposUnicos.add(nombre);
                        });
                }
            });

            // === METADATOS DEL PROCESO (para comentarios y lógica) ===
            const {
                volumen_mensual,
                normativa,
                reporte_obligatorio,
                potencial_digital,
                documento_final,
                proceso_padre,
                aprobador_final,
                area_inicio,
                area_cierre
            } = procData;

            // === SQL ===
            let sql = `-- =======================================\n`;
            sql += `-- TABLA GENERADA PARA: ${procData.nombre}\n`;
            sql += `-- Área inicio: ${area_inicio || '—'}\n`;
            if (area_cierre) sql += `-- Área cierre: ${area_cierre}\n`;
            if (volumen_mensual) sql += `-- Volumen mensual: ~${volumen_mensual} trámites\n`;
            if (normativa) sql += `-- Normativa: ${normativa}\n`;
            if (reporte_obligatorio) sql += `-- REPORTE OBLIGATORIO: SÍ\n`;
            if (potencial_digital === 'si') sql += `-- 100% DIGITALIZABLE\n`;
            if (potencial_digital === 'parcial') sql += `-- DIGITALIZACIÓN PARCIAL\n`;
            if (documento_final) sql += `-- Documento final: ${documento_final}\n`;
            if (proceso_padre) sql += `-- Proceso padre: ${proceso_padre}\n`;
            if (aprobador_final) sql += `-- Aprobador final: ${aprobador_final}\n`;
            sql += `-- =======================================\n\n`;

            sql += `CREATE TABLE ${nombreTabla} (\n`;
            sql += `  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n`;
            sql += `  created_at TIMESTAMPTZ DEFAULT NOW(),\n`;
            sql += `  updated_at TIMESTAMPTZ DEFAULT NOW(),\n`;
            sql += `  estado VARCHAR(50) DEFAULT 'paso_1',\n`;
            sql += `  area_actual VARCHAR(100),\n`;
            sql += `  usuario_asignado UUID REFERENCES auth.users(id),\n`;
            sql += `  responsable_actual VARCHAR(100),\n`;
            sql += `  fecha_inicio TIMESTAMPTZ,\n`;
            sql += `  fecha_estimada_finalizacion TIMESTAMPTZ,\n`;
            sql += `  notas TEXT,\n`;

            if (camposUnicos.size > 0) {
                sql += `\n  -- Campos específicos del trámite\n`;
                camposUnicos.forEach(campo => {
                    sql += `  ${campo} TEXT,\n`;
                });
            }

            if (reporte_obligatorio) {
                sql += `  reporte_enviado BOOLEAN DEFAULT FALSE,\n`;
            }
            if (documento_final) {
                sql += `  documento_final_generado VARCHAR(255),\n`;
            }

            sql = sql.replace(/,\n$/, '\n'); // Quitar última coma
            sql += `);\n\n`;

            // Historial
            sql += `-- Tabla de auditoría\n`;
            sql += `CREATE TABLE ${nombreTabla}_historial (\n`;
            sql += `  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n`;
            sql += `  ${nombreTabla}_id UUID REFERENCES ${nombreTabla}(id) ON DELETE CASCADE,\n`;
            sql += `  paso_numero INTEGER,\n`;
            sql += `  paso_descripcion TEXT,\n`;
            sql += `  area VARCHAR(100),\n`;
            sql += `  usuario UUID REFERENCES auth.users(id),\n`;
            sql += `  accion VARCHAR(50),\n`;
            sql += `  timestamp TIMESTAMPTZ DEFAULT NOW(),\n`;
            sql += `  observaciones TEXT\n`;
            sql += `);\n\n`;

            // Índices
            sql += `CREATE INDEX idx_${nombreTabla}_estado ON ${nombreTabla}(estado);\n`;
            sql += `CREATE INDEX idx_${nombreTabla}_area ON ${nombreTabla}(area_actual);\n`;
            if (reporte_obligatorio) {
                sql += `CREATE INDEX idx_${nombreTabla}_reporte ON ${nombreTabla}(reporte_enviado);\n`;
            }

            // === RLS ===
            let rls = `-- RLS para: ${procData.nombre}\n`;
            rls += `ALTER TABLE ${nombreTabla} ENABLE ROW LEVEL SECURITY;\n\n`;

            // Solo usuarios del área actual
            rls += `CREATE POLICY "ver_su_area" ON ${nombreTabla}\n`;
            rls += `  FOR SELECT USING (\n`;
            rls += `    area_actual IN (\n`;
            rls += `      SELECT area FROM usuarios_areas WHERE user_id = auth.uid()\n`;
            rls += `    )\n`;
            rls += `  );\n\n`;

            // Solo el asignado puede actualizar
            rls += `CREATE POLICY "actualizar_asignado" ON ${nombreTabla}\n`;
            rls += `  FOR UPDATE USING (usuario_asignado = auth.uid());\n\n`;

            // Supervisores y aprobador final
            if (aprobador_final || proceso_padre) {
                rls += `CREATE POLICY "supervisores_y_aprobador" ON ${nombreTabla}\n`;
                rls += `  FOR ALL USING (\n`;
                rls += `    EXISTS (SELECT 1 FROM user_roles WHERE user_id = auth.uid() AND role = 'supervisor')\n`;
                if (aprobador_final) {
                    rls += `    OR responsable_actual = '${aprobador_final}'\n`;
                }
                rls += `  );\n`;
            } else {
                rls += `CREATE POLICY "supervisores_todo" ON ${nombreTabla}\n`;
                rls += `  FOR ALL USING (\n`;
                rls += `    EXISTS (SELECT 1 FROM user_roles WHERE user_id = auth.uid() AND role = 'supervisor')\n`;
                rls += `  );\n`;
            }

            // === REACT COMPONENT ===
            let componente = `function Formulario${procData.nombre.replace(/[^a-zA-Z0-9]/g, '')}() {\n`;
            componente += `  const [form, setForm] = useState({\n`;
            camposUnicos.forEach(campo => {
                componente += `    ${campo}: '',\n`;
            });
            componente += `    estado: 'paso_1',\n`;
            componente += `    area_actual: '${area_inicio || ''}'\n`;
            componente += `  });\n\n`;

            componente += `  const handleSubmit = async () => {\n`;
            componente += `    const { error } = await supabase\n`;
            componente += `      .from('${nombreTabla}')\n`;
            componente += `      .insert([{ ...form }]);\n\n`;
            componente += `    if (!error) alert('Trámite iniciado correctamente');\n`;
            componente += `  };\n\n`;

            componente += `  return (\n`;
            componente += `    <div className="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">\n`;
            componente += `      <h2 className="text-2xl font-bold mb-6">{procData.nombre}</h2>\n`;

            if (normativa) {
                componente += `      <p className="text-sm text-gray-600 mb-4">Normativa: {${JSON.stringify(normativa)}}</p>\n`;
            }

            camposUnicos.forEach(campo => {
                const label = campo.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                componente += `      <div className="mb-4">\n`;
                componente += `        <label className="block text-sm font-medium mb-1">${label}</label>\n`;
                componente += `        <input\n`;
                componente += `          type="text"\n`;
                componente += `          value={form.${campo}}\n`;
                componente += `          onChange={e => setForm({...form, ${campo}: e.target.value})}\n`;
                componente += `          className="border border-gray-300 p-2 rounded w-full"\n`;
                componente += `          required\n`;
                componente += `        />\n`;
                componente += `      </div>\n`;
            });

            componente += `      <button onClick={handleSubmit} className="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">\n`;
            componente += `        Iniciar Trámite\n`;
            componente += `      </button>\n`;
            componente += `    </div>\n`;
            componente += `  );\n`;
            componente += `}\n`;

            // === EDGE FUNCTION (WORKFLOW) ===
            let workflow = `// Edge Function: workflow_${nombreTabla}.ts\n`;
            workflow += `Deno.serve(async (req) => {\n`;
            workflow += `  const supabase = createClient(Deno.env.get('SUPABASE_URL'), Deno.env.get('SUPABASE_ANON_KEY'));\n`;
            workflow += `  const { registro_id, accion, datos } = await req.json();\n\n`;

            workflow += `  const { data: reg, error } = await supabase\n`;
            workflow += `    .from('${nombreTabla}')\n`;
            workflow += `    .select('*')\n`;
            workflow += `    .eq('id', registro_id)\n`;
            workflow += `    .single();\n\n`;

            workflow += `  if (error || !reg) return new Response(JSON.stringify({ error: 'No encontrado' }), { status: 404 });\n\n`;

            workflow += `  let nuevoEstado = reg.estado;\n\n`;
            workflow += `  switch (reg.estado) {\n`;

            pasos.forEach((paso, i) => {
                workflow += `    case 'paso_${i + 1}':\n`;
                if (paso.tiene_decision && paso.condicion_decision) {
                    const cond = paso.condicion_decision.includes('datos.')
                        ? paso.condicion_decision
                        : `datos.${paso.condicion_decision.toLowerCase().replace(/[^a-z0-9_]/g, '_')}`;
                    workflow += `      if (${cond}) {\n`;
                    workflow += `        nuevoEstado = '${paso.destino_si_cumple || `paso_${i + 2}`}'\n`;
                    workflow += `      } else {\n`;
                    workflow += `        nuevoEstado = '${paso.destino_si_no_cumple || `paso_${i + 2}`}'\n`;
                    workflow += `      }\n`;
                } else {
                    workflow += `      nuevoEstado = 'paso_${i + 2}';\n`;
                }
                workflow += `      break;\n`;
            });

            workflow += `    default:\n`;
            workflow += `      nuevoEstado = 'finalizado';\n`;
            if (documento_final) {
                workflow += `      // Generar documento final: ${documento_final}\n`;
            }
            if (reporte_obligatorio) {
                workflow += `      // Enviar reporte obligatorio\n`;
            }
            workflow += `  }\n\n`;

            workflow += `  const { error: updError } = await supabase\n`;
            workflow += `    .from('${nombreTabla}')\n`;
            workflow += `    .update({ \n`;
            workflow += `      estado: nuevoEstado,\n`;
            if (reporte_obligatorio && pasos.length > 0) {
                workflow += `      reporte_enviado: nuevoEstado === 'finalizado' ? true : reg.reporte_enviado,\n`;
            }
            workflow += `      updated_at: new Date().toISOString()\n`;
            workflow += `    })\n`;
            workflow += `    .eq('id', registro_id);\n\n`;

            workflow += `  if (updError) return new Response(JSON.stringify({ error: updError.message }), { status: 500 });\n\n`;

            workflow += `  return new Response(JSON.stringify({ success: true, nuevo_estado: nuevoEstado }), {\n`;
            workflow += `    headers: { 'Content-Type': 'application/json' }\n`;
            workflow += `  });\n`;
            workflow += `});\n`;

            setCodigoGenerado({ sql, rls, componente, workflow });
        } catch (err) {
            alert('Error: ' + err.message);
        } finally {
            setLoading(false);
        }
    };

    const copiarAlPortapapeles = (texto) => {
        navigator.clipboard.writeText(texto).then(() => {
            alert('Copiado al portapapeles');
        });
    };

    return (
        <div className="bg-surface p-6 rounded-lg border border-border max-w-6xl mx-auto">
            <div className="flex justify-between items-center mb-6">
                <div>
                    <h2 className="text-2xl font-bold text-text">Generador de Sistema</h2>
                    <p className="text-text-secondary mt-1">SQL, RLS, Formulario React y Workflow automático</p>
                </div>
                <button onClick={onVolver} className="text-primary hover:underline flex items-center gap-1">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                    </svg>
                    Volver
                </button>
            </div>

            <div className="mb-6 p-4 bg-surface rounded border border-border">
                <label className="block font-medium text-text mb-2">Seleccionar Proceso:</label>
                {cargandoProcesos ? (
                    <p className="text-text-secondary">Cargando procesos...</p>
                ) : (
                    <select
                        value={procesoSeleccionado}
                        onChange={e => setProcesoSeleccionado(e.target.value)}
                        className="border border-border p-2 rounded w-full bg-surface text-text"
                        disabled={procesos.length === 0}
                    >
                        <option value="">-- Elegir un proceso --</option>
                        {procesos.map(p => (
                            <option key={p.id} value={p.id}>{p.nombre}</option>
                        ))}
                    </select>
                )}
                <button
                    onClick={generarCodigo}
                    disabled={!procesoSeleccionado || loading}
                    className={`mt-3 px-4 py-2 rounded font-medium flex items-center gap-2 ${loading ? 'bg-gray-400' : 'btn-primary'}`}
                >
                    {loading ? 'Generando...' : (
                        <>
                            Generar Código Completo
                        </>
                    )}
                </button>
            </div>

            {codigoGenerado && (
                <div className="space-y-8">
                    {/* SQL */}
                    <div>
                        <h3 className="font-bold text-lg mb-2 text-text flex items-center justify-between">
                            SQL Schema
                            <button onClick={() => copiarAlPortapapeles(codigoGenerado.sql)} className="text-sm btn-primary px-3 py-1">
                                Copiar
                            </button>
                        </h3>
                        <pre className="bg-gray-900 text-green-400 p-4 rounded border border-border overflow-x-auto text-xs font-mono">
                            {codigoGenerado.sql}
                        </pre>
                    </div>

                    {/* RLS */}
                    <div>
                        <h3 className="font-bold text-lg mb-2 text-text flex items-center justify-between">
                            RLS Policies
                            <button onClick={() => copiarAlPortapapeles(codigoGenerado.rls)} className="text-sm btn-primary px-3 py-1">
                                Copiar
                            </button>
                        </h3>
                        <pre className="bg-gray-900 text-green-400 p-4 rounded border border-border overflow-x-auto text-xs font-mono">
                            {codigoGenerado.rls}
                        </pre>
                    </div>

                    {/* React */}
                    <div>
                        <h3 className="font-bold text-lg mb-2 text-text flex items-center justify-between">
                            Componente React
                            <button onClick={() => copiarAlPortapapeles(codigoGenerado.componente)} className="text-sm btn-primary px-3 py-1">
                                Copiar
                            </button>
                        </h3>
                        <pre className="bg-gray-900 text-green-400 p-4 rounded border border-border overflow-x-auto text-xs font-mono">
                            {codigoGenerado.componente}
                        </pre>
                    </div>

                    {/* Edge Function */}

                        <h3 className="font-bold text-lg mb-2 text-text flex items-center justify-between">
                            Edge Function (Workflow)
                            <button onClick={() => copiarAlPortapapeles(codigoGenerado.workflow)} className="text-sm btn-primary px-3 py-1">
                                Copiar
                            </button>
                        </h3>
                        <pre className="bg-gray-900 text-green-400 p-4 rounded border border-border overflow-x-auto text-xs font-mono">
                            {codigoGenerado.workflow}
                        </pre>
                    </div>
                </div>
            )}
        </div>
    );
}
        function App() {
            const [activeTab, setActiveTab] = useState('tracker');
            const [entrevistas, setEntrevistas] = useState([]);
            const [procesos, setProcesos] = useState([]);
            const [handoffs, setHandoffs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [entrevistaEnProgreso, setEntrevistaEnProgreso] = useState(null);
            const [procesoSeleccionado, setProcesoSeleccionado] = useState(null);
            const [entrevistaAVer, setEntrevistaAVer] = useState(null);
            const [procesoAEliminar, setProcesoAEliminar] = useState(null);
            const [darkMode, setDarkMode] = useState(true);
            
            useEffect(() => {
                loadData();
                if (darkMode) {
                    document.body.classList.add('dark');
                } else {
                    document.body.classList.remove('dark');
                }
            }, [darkMode]);
            
            async function loadData() {
                try {
                    const [e, p, h] = await Promise.all([
                        supabase.from('entrevistas').select('*').order('fecha', { ascending: false }),
                        supabase.from('procesos').select('*').order('created_at', { ascending: false }),
                        supabase.from('handoffs').select('*').order('created_at', { ascending: false })
                    ]);
                    if (e.data) setEntrevistas(e.data);
                    if (p.data) setProcesos(p.data);
                    if (h.data) setHandoffs(h.data);
                } catch (error) {
                    console.error('Error:', error);
                } finally {
                    setLoading(false);
                }
            }
            
            async function editarEstadoEntrevista(id, nuevoEstado) {
                await supabase.from('entrevistas').update({ estado: nuevoEstado }).eq('id', id);
                loadData();
            }
            
            function iniciarCompletar(id) {
                setEntrevistaEnProgreso(id);
                setActiveTab('completar');
            }
            
            function verEntrevista(id) {
                setEntrevistaAVer(id);
                setActiveTab('ver-entrevista-modal');
            }
            
            function verDetalleProceso(id) {
                setProcesoSeleccionado(id);
                setActiveTab('detalle-proceso');
            }
            
            function editarProceso(id) {
                setProcesoAEliminar(id);
                setActiveTab('editar-proceso');
            }
            
            if (loading) return <div className="p-6 text-center text-text">Cargando...</div>;
            
            return (
                <div className="min-h-screen p-6" style={{backgroundColor: 'var(--color-bg)'}}>
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-6">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-3xl font-bold text-text">Sistema de Relevamiento de Procesos</h1>
                                    <p className="text-text-secondary mt-1">Ministerio de Ecología - Provincia de Misiones</p>
                                </div>
                                <DarkModeToggle darkMode={darkMode} setDarkMode={setDarkMode} />
                            </div>
                        </div>
                        
                        {activeTab !== 'completar' && activeTab !== 'detalle-proceso' && activeTab !== 'ver-entrevista-modal' && activeTab !== 'editar-proceso' && (
                            <div className="flex gap-2 mb-6 border-b border-border">
                                <button onClick={() => setActiveTab('tracker')} className={'px-4 py-2 font-medium ' + (activeTab === 'tracker' ? 'border-b-2 text-primary' : 'text-text-secondary')} style={activeTab === 'tracker' ? {borderColor: 'var(--color-primary)'} : {}}>
                                    Agendar Entrevistas
                                </button>
                                <button onClick={() => setActiveTab('entrevistas')} className={'px-4 py-2 font-medium ' + (activeTab === 'entrevistas' ? 'border-b-2 text-primary' : 'text-text-secondary')} style={activeTab === 'entrevistas' ? {borderColor: 'var(--color-primary)'} : {}}>
                                    Entrevistas ({entrevistas.length})
                                </button>
                                <button onClick={() => setActiveTab('procesos')} className={'px-4 py-2 font-medium ' + (activeTab === 'procesos' ? 'border-b-2 text-primary' : 'text-text-secondary')} style={activeTab === 'procesos' ? {borderColor: 'var(--color-primary)'} : {}}>
                                    Procesos ({procesos.length})
                                </button>
                                <button onClick={() => setActiveTab('handoffs')} className={'px-4 py-2 font-medium ' + (activeTab === 'handoffs' ? 'border-b-2 text-primary' : 'text-text-secondary')} style={activeTab === 'handoffs' ? {borderColor: 'var(--color-primary)'} : {}}>
                                    Handoffs ({handoffs.length})
                                </button>
                                 {/* ✅ Nueva pestaña */}
        <button onClick={() => setActiveTab('generador')} className={'px-4 py-2 font-medium ' + (activeTab === 'generador' ? 'border-b-2 text-primary' : 'text-text-secondary')} style={activeTab === 'generador' ? {borderColor: 'var(--color-primary)'} : {}}>
            Generador de Sistema
        </button>
                            </div>
                        )}
                        
                        <div>
                            {activeTab === 'tracker' && (
                                <TrackerEntrevistas
                                    entrevistas={entrevistas}
                                    setEntrevistas={setEntrevistas}
                                    onCompletar={iniciarCompletar}
                                />
                            )}
                            {activeTab === 'entrevistas' && (
                                <ListaEntrevistas
                                    entrevistas={entrevistas}
                                    onVer={verEntrevista}
                                    onEditarEstado={editarEstadoEntrevista}
                                />
                            )}
                            {activeTab === 'completar' && (
                                <FormularioEntrevista
                                    entrevistaId={entrevistaEnProgreso}
                                    onVolver={() => setActiveTab('tracker')}
                                />
                            )}
                            {activeTab === 'ver-entrevista-modal' && (
                                <VerEntrevista
                                    entrevistaId={entrevistaAVer}
                                    onCerrar={() => {
                                        setEntrevistaAVer(null);
                                        setActiveTab('entrevistas');
                                    }}
                                    onVerDetalle={(id) => {
                                        setProcesoSeleccionado(id);
                                        setActiveTab('detalle-proceso');
                                    }}
                                />
                            )}
                            {activeTab === 'detalle-proceso' && (
                                <DetalleProceso
                                    procesoId={procesoSeleccionado}
                                    onVolver={() => setActiveTab('procesos')}
                                />
                            )}
                            {activeTab === 'editar-proceso' && (
                                <EditarProceso
                                    procesoId={procesoAEliminar}
                                    onCerrar={() => {
                                        setProcesoAEliminar(null);
                                        setActiveTab('procesos');
                                        loadData();
                                    }}
                                />
                            )}
                            {activeTab === 'procesos' && (
                                <MatrizProcesos
                                    procesos={procesos}
                                    onVerDetalle={verDetalleProceso}
                                    onEditar={editarProceso}
                                />
                            )}
                            {activeTab === 'handoffs' && (
                                <ValidacionHandoffs
                                    handoffs={handoffs}
                                    onRecargar={loadData}
                                />
                            )}
                            {activeTab === 'generador' && (
    <GeneradorSistema
        onVolver={() => setActiveTab('tracker')}
    />
)}
                            
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
